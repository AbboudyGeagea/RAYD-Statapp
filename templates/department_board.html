<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
    <title>RAYD | Live Department</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
    <style>
        /* A wall / smart-TV display (operator, 2026-11-19): the whole board on one screen, no
           scrolling, everything on the cards. Card sizes and the text scale are worked out in
           the script from the number of rooms and the screen; content is sized in em. */
        :root {
            --bg: #0a0f0d; --panel: #111714; --panel-2: #172019; --line: #223029;
            --fg: #e6eee9; --muted: #8fa199; --faint: #5f7069;
            --free: #22c55e; --free-soft: rgba(34,197,94,.14);
            --busy: #3b82f6; --busy-soft: rgba(59,130,246,.16);
            --over: #ef4444; --over-soft: rgba(239,68,68,.18);
            --late: #f97316; --late-soft: rgba(249,115,22,.20);
            --early: #eab308; --early-soft: rgba(234,179,8,.20);
            --closed: #64748b;
            --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        }
        body.light {
            --bg: #eef3f0; --panel: #ffffff; --panel-2: #f2f6f4; --line: #d6e0da;
            --fg: #18221d; --muted: #586a62; --faint: #8a9a93;
            --free: #15803d; --busy: #1d4ed8; --over: #b91c1c; --late: #c2410c; --early: #a16207;
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { height: 100%; }
        body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.3 'Inter', system-ui, sans-serif;
               display: flex; flex-direction: column; overflow: hidden; }
        button, input { font: inherit; color: inherit; }
        .chart-info-icon { cursor: pointer; color: var(--muted); font-size: .8em; margin-left: 4px; }

        /* ── top bar ── */
        .top { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 5px 10px;
               background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
        .top h1 { margin: 0; font-size: 16px; font-weight: 800; display: flex; gap: 7px; align-items: center; white-space: nowrap; }
        .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--free); box-shadow: 0 0 0 3px var(--free-soft); }
        .live-dot.stale { background: var(--over); box-shadow: 0 0 0 3px var(--over-soft); }
        .clock { font: 700 20px/1 var(--mono); }
        .date { color: var(--muted); font-size: 11px; }
        .kpis { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .kpi { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; white-space: nowrap; }
        .kpi b { font-size: 16px; font-variant-numeric: tabular-nums; margin-right: 4px; }
        .kpi small { color: var(--muted); font-size: 11px; }
        .kpi .lbl { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
        .kpi.alert b { color: var(--over); } .kpi.late b { color: var(--late); } .kpi.early b { color: var(--early); }
        .controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 2px 9px; cursor: pointer; font-size: 11.5px; }
        .chip[aria-pressed="true"] { border-color: var(--busy); color: var(--busy); background: var(--busy-soft); font-weight: 700; }
        .site-switch { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
        .site-switch button { border: 0; background: var(--panel-2); padding: 3px 13px; cursor: pointer; font-weight: 800; font-size: 13px; }
        .site-switch button[aria-pressed="true"] { background: var(--busy); color: #fff; }
        .updated { color: var(--muted); font-size: 11px; min-width: 90px; text-align: right; }
        .banner { margin: 6px 10px 0; padding: 5px 10px; border-radius: 8px; background: var(--over-soft); color: var(--over); flex: none; }

        /* ── the rooms: a grid that fills the screen ── */
        .board { flex: 1; min-height: 0; position: relative; padding: 8px; overflow: hidden; }
        .grid { display: grid; gap: 8px; width: 100%; height: 100%; }
        .empty { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 18px; }
        .card { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; cursor: pointer;
                background: var(--panel); border: .16em solid var(--closed); border-radius: .7em; text-align: left; }
        .card:focus-visible { outline: 3px solid var(--fg); }
        .card.free { border-color: var(--free); } .card.busy { border-color: var(--busy); }
        .card.late { border-color: var(--late); } .card.closed { opacity: .6; }
        .c-head { display: flex; align-items: center; gap: .5em; padding: .28em .6em; background: var(--closed); color: #fff; flex: none; }
        .card.free .c-head { background: var(--free); } .card.busy .c-head { background: var(--busy); }
        .card.late .c-head { background: var(--late); }
        .c-head .nm { font-weight: 800; font-size: 1.12em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .c-head .st { margin-left: auto; font-size: .72em; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; flex: none; }
        .c-sub { font-size: .76em; color: var(--muted); padding: .12em .75em 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
        .c-now { margin: .3em .45em 0; padding: .28em .45em; border-radius: .45em; background: var(--panel-2); flex: none; }
        .c-now.run { background: var(--busy-soft); } .c-now.late { background: var(--late-soft); }
        .c-now.early { background: var(--early-soft); }
        .c-now .l1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .92em; }
        .c-now .who { font-weight: 800; } .c-now .what { color: var(--muted); }
        .c-now.early .who, .c-now.early b { color: var(--early); }
        .c-now .l2 { display: flex; justify-content: space-between; gap: .5em; font-variant-numeric: tabular-nums; font-size: .9em; margin-top: .1em; }
        .c-now.late .l2 b { color: var(--late); }
        .c-now.idle .l1 { color: var(--muted); font-weight: 700; }
        .bar { height: .3em; min-height: 3px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: .25em; }
        .bar > i { display: block; height: 100%; width: 0; background: var(--busy); border-radius: 99px; }
        .c-now.late .bar > i { background: var(--late); }
        .c-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .25em; padding: .3em .45em; flex: none; }
        .c-stats span { display: flex; flex-direction: column; align-items: center; background: var(--panel-2); border-radius: .4em; padding: .1em 0; min-width: 0; }
        .c-stats b { font-size: 1.3em; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .c-stats small { font-size: .64em; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .c-stats .alert { background: var(--over-soft); } .c-stats .alert b, .c-stats .alert small { color: var(--over); }
        .c-list { list-style: none; margin: 0; padding: 0 .45em; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: .15em; position: relative; }
        .c-list li { display: flex; justify-content: space-between; gap: .5em; font-size: .86em; padding: .05em .35em; border-radius: .35em; flex: none; }
        .c-list li .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .c-list li b { font: 700 1em/1.2 var(--mono); white-space: nowrap; }
        .c-list li.w b { color: var(--free); }
        .c-list li.w.over { background: var(--over-soft); } .c-list li.w.over b, .c-list li.w.over .p { color: var(--over); }
        .c-list li.next { color: var(--muted); } .c-list li.next b { color: var(--muted); font-weight: 400; }
        .c-list li.sep { color: var(--faint); font-size: .7em; text-transform: uppercase; letter-spacing: .06em; padding-top: .15em; }
        .c-more { font-size: .72em; color: var(--muted); text-align: right; padding: 0 .7em; flex: none; }
        .c-util { height: .3em; min-height: 3px; background: var(--line); flex: none; margin-top: .2em; }
        .c-util i { display: block; height: 100%; background: var(--free); }

        /* ── footer: each modality, and the colour key ── */
        /* read from across the room (operator, 2026-11-24: "too small"): sized to the screen */
        .foot { flex: none; display: flex; flex-wrap: wrap; gap: .2em 1em; align-items: center; padding: .3em .7em;
                background: var(--panel); border-top: 1px solid var(--line); font-size: clamp(14px, 1.15vw, 22px);
                color: var(--muted); max-height: 4.8em; overflow: hidden; }
        .foot .mod b { color: var(--fg); margin-right: .25em; }
        .foot .mod .alert { color: var(--over); font-weight: 700; }
        .foot .key { margin-left: auto; display: flex; gap: .8em; flex-wrap: wrap; }
        .foot i.sw { display: inline-block; width: .75em; height: .75em; border-radius: .2em; margin-right: .3em; vertical-align: -.05em; }

        /* ── both hospitals at once: one pane per hospital, each a full live board ── */
        .board.split { padding: 8px; }
        .split { display: flex; gap: 8px; width: 100%; height: 100%; }
        .pane { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line);
                border-radius: 10px; overflow: hidden; background: var(--bg); }
        .pane-head { flex: none; display: flex; flex-wrap: wrap; gap: .25em .7em; align-items: center; padding: .3em .6em;
                     background: var(--panel); border-bottom: 1px solid var(--line); font-size: clamp(12px, .9vw, 18px); }
        .pane-head .site { font-weight: 900; font-size: 1.45em; letter-spacing: .03em; }
        .pane-head .pname { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .pane-head .kpis { margin-left: auto; }
        .pane-head .kpi b { font-size: 1.15em; }
        .pane-head .kpi .lbl { font-size: .8em; }
        .pane-board { flex: 1; min-height: 0; padding: 6px; overflow: hidden; position: relative; }
        .pane-foot { flex: none; display: flex; flex-wrap: wrap; gap: .15em .9em; padding: .3em .6em; background: var(--panel);
                     border-top: 1px solid var(--line); color: var(--muted); font-size: clamp(13px, 1vw, 20px);
                     max-height: 3.4em; overflow: hidden; }
        .pane-foot .mod b { color: var(--fg); margin-right: .25em; }
        .pane-foot .mod .alert { color: var(--over); font-weight: 700; }

        /* ── details drawer (optional: a click on a room) ── */
        .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); z-index: 30; background: var(--panel);
                  border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.4); display: flex; flex-direction: column; }
        .dr-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
        .dr-head h3 { margin: 0; font-size: 18px; }
        .dr-head .sub { color: var(--muted); font-size: 12px; }
        .dr-close { margin-left: auto; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
        .dr-body { padding: 12px 14px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
        .dr-sec h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
                     display: flex; justify-content: space-between; }
        .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
        .list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
                   padding: 4px 6px; border-radius: 6px; background: var(--panel-2); }
        .list .p b { font-weight: 700; } .list .p small { color: var(--muted); display: block; }
        .wait { font: 700 12px/1 var(--mono); padding: 3px 6px; border-radius: 6px; background: var(--free-soft); color: var(--free); white-space: nowrap; }
        .wait.alert { background: var(--over-soft); color: var(--over); }
        .t { font: 12px/1 var(--mono); color: var(--muted); white-space: nowrap; }
        .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
        .kv span { color: var(--muted); }
        .none { color: var(--muted); font-size: 12px; }
        .limits { display: grid; grid-template-columns: 1fr 90px; gap: 6px 10px; align-items: center; }
        .limits input { width: 90px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; text-align: right; }
        .btn { border: 0; border-radius: 8px; padding: 6px 14px; background: var(--busy); color: #fff; font-weight: 700; cursor: pointer; }
        .msg { font-size: 12px; } .msg.err { color: var(--over); } .msg.ok { color: var(--free); }
    </style>
</head>
<body class="{{ 'light' if ui_theme == 'light' }}">
<header class="top">
    <h1><span class="live-dot" id="dot" title="Live"></span> Live Department<i class="bi bi-info-circle chart-info-icon" data-explain="live-board" role="button" tabindex="0" aria-label="About this board" title="About this board"></i></h1>
    <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
    <div class="site-switch" id="site-switch" role="group" aria-label="Hospital"></div>
    <div class="kpis"><span id="kpis" class="kpis"></span><i class="bi bi-info-circle chart-info-icon" data-explain="live-board-kpis" role="button" tabindex="0" aria-label="About these figures" title="About these figures"></i></div>
    <div class="controls">
        <div id="mod-chips" style="display:flex;flex-wrap:wrap;gap:4px"></div>
        <button class="chip" id="sites-btn" type="button" aria-pressed="false" title="Both hospitals on one screen, each with its own live board" hidden>
            <i class="bi bi-layout-split"></i> Side by side</button>
        {% if can_edit_limits %}
        <button class="chip" id="limits-btn" type="button" title="Wait limit per modality, and when an exam is done too early">
            <i class="bi bi-sliders"></i> Limits</button>
        {% endif %}
        <button class="chip" id="names" type="button" aria-pressed="false" title="Patient names, or initials only (the default on a wall screen)">
            <i class="bi bi-person"></i> Names</button>
        <button class="chip" id="full-btn" type="button" title="Full screen (Esc to leave)"><i class="bi bi-arrows-fullscreen"></i> Full screen</button>
        <span class="updated" id="updated"></span>
    </div>
</header>
<div class="banner" id="banner" hidden></div>
<main class="board" id="board" aria-label="Department"><div class="empty">Loading the department…</div></main>
<footer class="foot" id="foot"></footer>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="false" aria-labelledby="dr-title"></aside>

<script>
(function () {
'use strict';
const REFRESH = {{ refresh_seconds|int }} * 1000;
const CSRF = (document.querySelector('meta[name="csrf-token"]') || {}).content || '';
const BASE_W = 300, BASE_H = 215, BASE_FONT = 14, GAP = 8;   // a card designed at 14 px
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const store = {
  get(k, d) { try { const v = localStorage.getItem('deptboard.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('deptboard.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
let B = null, BB = {}, offset = 0, lastOk = null, open = null;
let mods = store.get('mods', []), names = store.get('names', false), site = store.get('site', null);
let split = store.get('split', false);   // both hospitals at once (operator, 2026-11-24), remembered on this screen

// Server time is the hospital clock; the browser's may differ. Every countdown runs on
// server time = browser time + offset, measured at each fetch.
const serverNow = () => new Date(Date.now() + offset);
const parse = s => s ? new Date(s) : null;          // naive ISO = hospital local time
const hm = d => d ? d.toTimeString().slice(0, 5) : '';
const mins = (a, b) => (a - b) / 60000;
function dur(m) {
  m = Math.max(0, Math.round(m));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
}
const short = m => { m = Math.max(0, Math.round(m)); return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`; };
function who(it) {                     // initials unless "Names" is on: a wall screen is seen by passers-by
  const n = it.patient || '';
  if (names) return n;
  return n.split(/\s+/).filter(Boolean).map(w => w[0].toUpperCase() + '.').join('') || '—';
}
const LABEL = {free: 'Free', busy: 'Busy', late: 'Late', closed: 'Closed'};
const SOURCE = {booked: 'booked on the RIS', procedure: 'the procedure’s usual duration',
                modality: 'the modality’s usual duration (none for the procedure)', default: 'a default (no duration known)'};
const roomsOf = b => b.lanes.flatMap(l => l.rooms);
const shownRoomsOf = b => roomsOf(b).filter(r => !mods.length || mods.includes(r.modality));
// the boards on screen: the picked hospital, or every hospital of the account side by side
const shownBoards = () => split && Object.keys(BB).length > 1 ? B.sites.map(s => BB[s.code]).filter(Boolean) : [B];

async function fetchBoard(code) {
  const q = code ? '?site=' + encodeURIComponent(code) : '';
  const r = await fetch('/viewer/department/api/board' + q, {headers: {'Accept': 'application/json'}});
  if (r.status === 401 || r.redirected) { location.reload(); throw new Error('signed out'); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}
async function load() {
  try {
    const d = await fetchBoard(site);
    if (d.site && d.site !== site) { site = d.site; store.set('site', site); }   // remembered on this screen
    let both = {};
    if (split && d.sites.length > 1) {          // the other hospitals, fetched the same way
      const others = d.sites.filter(s => s.code !== d.site);
      const got = await Promise.all(others.map(s => fetchBoard(s.code)));
      both = {[d.site]: d};
      others.forEach((s, i) => { both[s.code] = got[i]; });
    }
    B = d; BB = both; offset = parse(d.now) - Date.now(); lastOk = Date.now();
    $('banner').hidden = true;
    render();
  } catch (e) {
    $('banner').hidden = false;
    $('banner').textContent = 'The board could not be refreshed (' + e.message + '). ' +
      (lastOk ? 'Showing the data from ' + hm(new Date(lastOk + offset)) + '.' : '');
  }
}

// ── one room card: everything a manager reads without a click ─────────────────
function card(r, b) {
  const c = r.current, e = r.early, u = r.utilization_pct, first = r.waiting[0];
  let now;
  if (c) now = `<div class="c-now ${c.late ? 'late' : 'run'}" data-start="${esc(c.started_at)}" data-end="${esc(c.expected_end)}">
      <div class="l1"><span class="who">${esc(who(c))}</span> <span class="what">${esc(c.procedure)}</span></div>
      <div class="l2"><span>${hm(parse(c.started_at))} → ${hm(parse(c.expected_end))}</span><b class="left"></b></div>
      <div class="bar"><i></i></div></div>`;
  else if (e) now = `<div class="c-now early" title="Marked done in less than ${b.limits.early_pct} % of its expected time">
      <div class="l1"><span class="who">${esc(who(e))}</span> <span class="what">${esc(e.procedure)}</span></div>
      <div class="l2"><span>done early ${hm(parse(e.done_at))}</span><b>${short(e.took_min)} of ${short(e.expected_minutes)}</b></div></div>`;
  else now = `<div class="c-now idle"><div class="l1">${r.status === 'closed' ? 'Closed today' + (r.exception ? ': ' + esc(r.exception) : '')
      : r.last_done_at ? 'Free since ' + hm(parse(r.last_done_at)) : 'Free'}</div></div>`;
  const rows = r.waiting.map(w => `<li class="w${w.over ? ' over' : ''}"><span class="p">${esc(who(w))} · ${esc(w.procedure)}</span>
      <b data-since="${esc(w.arrived_at)}" data-fmt="short" data-limit="${r.wait_limit_min}">${short(w.wait_min)}</b></li>`);
  if (r.coming.length) {
    rows.push(`<li class="sep">Next</li>`);
    r.coming.forEach(x => rows.push(`<li class="next"><span class="p">${esc(who(x))} · ${esc(x.procedure)}</span><b>${hm(parse(x.appointment_at))}</b></li>`));
  }
  return `<div class="card ${r.status}" role="button" tabindex="0" data-room="${esc(r.key)}" data-site="${esc(b.site)}" title="${esc(r.room)} — click for details">
    <div class="c-head"><span class="nm">${esc(r.room)}</span><span class="st">${LABEL[r.status]}</span></div>
    <div class="c-sub">${esc(r.modality)} · ${esc(r.room_code)}</div>
    ${now}
    <div class="c-stats">
      <span title="Booked on this room today"><b>${r.scheduled_today}</b><small>booked</small></span>
      <span title="Booked today, not arrived yet"><b>${r.to_come}</b><small>to come</small></span>
      <span class="${r.waiting_over ? 'alert' : ''}" title="Arrived, not started; red past ${r.wait_limit_min} min"><b>${r.waiting.length}</b><small>${first ? `arrived · <span data-since="${esc(first.arrived_at)}" data-fmt="short">${short(first.wait_min)}</span>` : 'arrived'}</small></span>
      <span title="Done today"><b>${r.done_today}</b><small>done</small></span>
      <span title="Utilization so far today"><b>${u == null ? '—' : u + '%'}</b><small>util</small></span>
    </div>
    <ul class="c-list">${rows.join('')}</ul><div class="c-more" hidden></div>
    <div class="c-util"><i style="width:${Math.min(100, u || 0)}%"></i></div>
  </div>`;
}

// ── the grid: as many columns as give the biggest cards for this screen ─────────
function fitGrid() {
  document.querySelectorAll('#board .grid').forEach(grid => {
    const box = grid.parentElement, cs = getComputedStyle(box);
    const n = grid.children.length;
    const W = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let best = {c: 1, r: n, s: 0};
    for (let c = 1; c <= n; c++) {
      const r = Math.ceil(n / c);
      const s = Math.min((W - (c - 1) * GAP) / c / BASE_W, (H - (r - 1) * GAP) / r / BASE_H);
      if (s > best.s) best = {c, r, s};
    }
    grid.style.gridTemplateColumns = `repeat(${best.c}, minmax(0, 1fr))`;
    grid.style.gridTemplateRows = `repeat(${best.r}, minmax(0, 1fr))`;
    grid.style.fontSize = Math.max(9, Math.min(30, BASE_FONT * best.s)) + 'px';
  });
  trimLists();
}
// The waiting and next patients that do not fit their card become "+n more". The line is
// shown before trimming, so the rows are trimmed to the space left beside it.
function trimLists() {
  document.querySelectorAll('.grid .card').forEach(cd => {
    const ul = cd.querySelector('.c-list'), more = cd.querySelector('.c-more');
    more.hidden = true;
    if (ul.scrollHeight <= ul.clientHeight + 1) return;
    more.hidden = false;
    more.textContent = '+0 more';
    let hidden = 0;
    while (ul.lastElementChild && ul.scrollHeight > ul.clientHeight + 1) {
      if (!ul.lastElementChild.classList.contains('sep')) hidden++;
      ul.lastElementChild.remove();
    }
    if (ul.lastElementChild && ul.lastElementChild.classList.contains('sep')) ul.lastElementChild.remove();
    more.textContent = `+${hidden} more`;
  });
}
// The board area changes size when the top bar or the footer wrap differently (the date, the
// icon font arriving), on full screen, or when the TV changes resolution: lay it out again,
// from the data, so the trimmed rows come back where there is room.
let lastBox = '', fitTimer = null;
function refit() {
  const b = $('board'), key = b.clientWidth + 'x' + b.clientHeight;
  if (key === lastBox) return;
  lastBox = key;
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => { if (B) render(); }, 120);
}
if ('ResizeObserver' in window) new ResizeObserver(refit).observe($('board'));
window.addEventListener('resize', refit);

// ── render ────────────────────────────────────────────────────────────────────
function kpisHtml(t) {
  const kpi = (v, l, cls) => `<div class="kpi ${cls || ''}"><b>${v}</b><span class="lbl">${esc(l)}</span></div>`;
  return kpi(`${t.busy}/${t.rooms}`, 'busy') + kpi(t.late, 'late', t.late ? 'late' : '') +
    kpi(t.early, 'done early', t.early ? 'early' : '') +
    kpi(t.waiting + (t.waiting_over ? ` <small>(${t.waiting_over} over)</small>` : ''), 'arrived', t.waiting_over ? 'alert' : '') +
    kpi(t.longest_wait_since ? `<span data-since="${esc(t.longest_wait_since)}">${dur(t.longest_wait_min)}</span>` : '—', 'longest wait') +
    kpi(`${t.scheduled_today} <small>(${t.to_come} to come)</small>`, 'booked') + kpi(t.done_today, 'done') +
    kpi(t.utilization_pct == null ? '—' : t.utilization_pct + '%', 'util');
}
// each modality of one hospital: busy rooms, arrived, booked, utilization
function lanesHtml(b) {
  return b.lanes.map(l => {
    const s = l.summary;
    return `<span class="mod"><b>${esc(l.modality)}</b>${s.busy}/${s.rooms} busy · <span class="${s.waiting_over ? 'alert' : ''}">${s.waiting} arrived</span> · ${s.scheduled_today} booked · ${s.utilization_pct == null ? '—' : s.utilization_pct + '%'}</span>`;
  }).join('') + (b.unknown_rooms.length ? `<span class="mod alert">Rooms not in RAYD: ${b.unknown_rooms.map(u => esc(u.code) + ' (' + u.studies + ')').join(', ')}</span>` : '');
}
function paneHtml(b) {
  const rooms = shownRoomsOf(b), name = (b.sites.find(x => x.code === b.site) || {}).name || '';
  return `<section class="pane" aria-label="${esc(name || b.site)}">
    <div class="pane-head"><span class="site">${esc(b.site)}</span><span class="pname">${esc(name)}</span><span class="kpis">${kpisHtml(b.totals)}</span></div>
    <div class="pane-board">${rooms.length ? `<div class="grid">${rooms.map(r => card(r, b)).join('')}</div>`
      : '<div class="empty">No room open today or booked.</div>'}</div>
    <div class="pane-foot">${lanesHtml(b)}</div></section>`;
}

function render() {
  if (!B) return;
  const boards = shownBoards(), both = boards.length > 1;
  $('kpis').innerHTML = both ? '' : kpisHtml(B.totals);       // side by side: each pane has its own
  $('site-switch').innerHTML = B.sites.map(x =>
    `<button type="button" data-site="${esc(x.code)}" aria-pressed="${!both && x.code === B.site}" title="${esc(x.name)}">${esc(x.code)}</button>`).join('');
  $('sites-btn').hidden = B.sites.length < 2;
  $('sites-btn').setAttribute('aria-pressed', String(both));
  const all = [...new Set(boards.flatMap(b => b.lanes.map(l => l.modality)))];
  mods = mods.filter(m => all.includes(m));
  $('mod-chips').innerHTML = `<button class="chip" type="button" data-mod="" aria-pressed="${!mods.length}">All</button>` +
    all.map(m => `<button class="chip" type="button" data-mod="${esc(m)}" aria-pressed="${mods.includes(m)}">${esc(m)}</button>`).join('');
  $('names').setAttribute('aria-pressed', String(names));

  const box = $('board');
  box.classList.toggle('split', both);
  if (both) {
    box.innerHTML = `<div class="split">${boards.map(paneHtml).join('')}</div>`;
    fitGrid();
  } else {
    const rooms = shownRoomsOf(B);
    if (!rooms.length) {
      box.innerHTML = '<div class="empty">No room of this hospital is open today or has anything booked.</div>';
    } else {
      box.innerHTML = `<div class="grid">${rooms.map(r => card(r, B)).join('')}</div>`;
      fitGrid();
    }
  }
  renderFoot(both);
  if (open) renderDrawer();
  tick();
}

function renderFoot(both) {
  // side by side, each hospital's modalities sit at the bottom of its pane; here the key
  $('foot').innerHTML = (both ? '' : lanesHtml(B)) + `<span class="key">
      <span><i class="sw" style="background:var(--free)"></i>Free</span><span><i class="sw" style="background:var(--busy)"></i>Busy</span>
      <span><i class="sw" style="background:var(--late)"></i>Late</span><span><i class="sw" style="background:var(--early)"></i>Done under ${B.limits.early_pct} % of its time</span>
      <span><i class="sw" style="background:var(--over)"></i>Wait over the limit (${Object.entries(B.limits.wait_min).map(([m, v]) => esc(m) + ' ' + v).join(', ') || 'none set'}; else ${B.limits.default_wait_min} min)</span></span>`;
}

// ── details (optional) ────────────────────────────────────────────────────────
function waitList(items, limit) {
  if (!items.length) return '<div class="none">Nobody waiting.</div>';
  return `<ul class="list">${items.map(x => `<li><span class="p"><b>${esc(who(x))}</b><small>${esc(x.procedure)}${x.appointment_at ? ' · booked ' + hm(parse(x.appointment_at)) : ''} · arrived ${hm(parse(x.arrived_at))}</small></span>
    <span class="wait${x.over ? ' alert' : ''}" data-since="${esc(x.arrived_at)}" data-fmt="wait" data-limit="${limit}">${dur(x.wait_min)}</span></li>`).join('')}</ul>`;
}
function comingList(items) {
  if (!items.length) return '<div class="none">Nobody else booked today.</div>';
  return `<ul class="list">${items.map(x => `<li><span class="p"><b>${esc(who(x))}</b><small>${esc(x.procedure)}</small></span>
    <span class="t">${hm(parse(x.appointment_at))}</span></li>`).join('')}</ul>`;
}

// ── the hospitals side by side: the split screen (paneHtml); each hospital's figures per
// modality sit at the bottom of its pane (operator, 2026-11-24) ──

function limitsHtml() {
  const L = B.limits;
  return `<div class="dr-sec"><h4><span>Wait limit per modality (minutes)</span></h4>
      <div class="limits">${Object.keys(L.wait_min).map(m => `<label for="lim-${esc(m)}">${esc(m)}</label><input id="lim-${esc(m)}" type="number" min="1" max="600" data-mod="${esc(m)}" value="${L.wait_min[m]}">`).join('')}
        <label for="lim-default">Any other modality</label><input id="lim-default" type="number" min="1" max="600" value="${L.default_wait_min}"></div></div>
    <div class="dr-sec"><h4><span>Done too early</span></h4>
      <div class="limits"><label for="lim-early">Under this share of the expected time (%)</label><input id="lim-early" type="number" min="1" max="99" value="${L.early_pct}"></div></div>
    <div style="display:flex;gap:10px;align-items:center"><button class="btn" type="button" data-save-limits>Save</button><span class="msg" id="lim-msg"></span></div>
    <div class="none">Applies to every screen showing the board, for both hospitals, from the next refresh.</div>`;
}
async function saveLimits() {
  const wait = {};
  document.querySelectorAll('.limits input[data-mod]').forEach(i => { if (i.value) wait[i.dataset.mod] = +i.value; });
  const body = {wait_min: wait, default_wait_min: +$('lim-default').value, early_pct: +$('lim-early').value};
  const msg = $('lim-msg');
  try {
    const r = await fetch('/viewer/department/api/limits', {method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF}, body: JSON.stringify(body)});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
    msg.className = 'msg ok'; msg.textContent = 'Saved.';
    load();
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
}

function renderDrawer() {
  let html;
  if (open.limits) {
    if ($('drawer').querySelector('[data-save-limits]')) return;       // keep what is being typed
    html = `<div class="dr-head"><div><h3 id="dr-title">Limits</h3>
        <div class="sub">When a wait turns red, and when an exam counts as done too early</div></div>
        <button class="dr-close" type="button" data-close>Close</button></div>
      <div class="dr-body">${limitsHtml()}</div>`;
  } else {
    const b = shownBoards().find(x => x.site === open.site) || B;
    const r = roomsOf(b).find(x => x.key === open.room);
    if (!r) { closeDrawer(); return; }
    const c = r.current, e = r.early, u = r.utilization_pct;
    const now = c ? `<div class="c-now ${c.late ? 'late' : 'run'}" data-start="${esc(c.started_at)}" data-end="${esc(c.expected_end)}" style="font-size:14px;margin:0">
        <div class="l1"><span class="who">${esc(who(c))}</span> <span class="what">${esc(c.procedure)}${c.accession ? ' · ' + esc(c.accession) : ''}</span></div>
        <div class="l2"><span>Started ${hm(parse(c.started_at))} · expected end ${hm(parse(c.expected_end))}</span><b class="left"></b></div>
        <div class="bar"><i></i></div>
        <div class="none" style="margin-top:4px">${c.expected_minutes} min: ${SOURCE[c.expected_source]}</div>
        ${r.also_in_progress ? `<div class="none">${r.also_in_progress} older exam still open: no completion received.</div>` : ''}</div>`
      : `<div class="none">${r.status === 'closed' ? 'Closed today' + (r.exception ? ': ' + esc(r.exception) : '') : r.last_done_at ? 'Free since ' + hm(parse(r.last_done_at)) : 'No exam running.'}</div>`;
    const early = e ? `<div class="dr-sec"><h4><span>Last exam done too early</span></h4><div class="c-now early" style="font-size:14px;margin:0">
        <div class="l1"><span class="who">${esc(who(e))}</span> <span class="what">${esc(e.procedure)}</span></div>
        <div class="l2"><span>${hm(parse(e.started_at))} → ${hm(parse(e.done_at))}</span><b>${dur(e.took_min)} of ${dur(e.expected_minutes)}</b></div></div></div>` : '';
    html = `<div class="dr-head"><div><h3 id="dr-title">${esc(r.room)}</h3>
        <div class="sub">${esc([r.room_code, r.modality, r.site].filter(Boolean).join(' · '))}</div></div>
        <span class="chip" style="cursor:default">${LABEL[r.status]}</span>
        <button class="dr-close" type="button" data-close>Close</button></div>
      <div class="dr-body">
        <div class="dr-sec"><h4><span>In the room</span></h4>${now}</div>
        ${early}
        <div class="dr-sec"><h4><span>Arrived, waiting ${r.waiting.length}</span><span>red past ${r.wait_limit_min} min</span></h4>${waitList(r.waiting, r.wait_limit_min)}</div>
        <div class="dr-sec"><h4><span>Still to come today ${r.to_come}</span><span>${r.scheduled_today} booked today</span></h4>${comingList(r.coming)}</div>
        <div class="dr-sec"><h4><span>Utilization so far today</span><span>${u == null ? '—' : u + '%'}</span></h4>
          <div class="kv">
            <span>Busy</span><b>${dur(r.busy_min)}</b>
            <span>Open so far</span><b>${dur(r.open_min)} of ${dur(r.opening_minutes)} today, from ${hm(parse(r.window_start))}</b>
            <span>Done today</span><b>${r.done_today}</b>
          </div></div>
      </div>`;
  }
  $('drawer').innerHTML = html;
  $('drawer').style.top = document.querySelector('.top').offsetHeight + 'px';
  $('drawer').hidden = false;
}
function closeDrawer() { open = null; $('drawer').hidden = true; $('drawer').innerHTML = ''; }

// ── every second: clock, waits, countdowns ────────────────────────────────────
function tick() {
  const n = serverNow();
  $('clock').textContent = n.toTimeString().slice(0, 8);
  $('date').textContent = n.toLocaleDateString(undefined, {weekday: 'long', day: 'numeric', month: 'long'});
  document.querySelectorAll('[data-since]').forEach(el => {
    const m = mins(n, parse(el.dataset.since));
    el.textContent = el.dataset.fmt === 'short' ? short(m) : dur(m);
    if (el.dataset.limit) {
      const over = m >= +el.dataset.limit;
      if (el.dataset.fmt === 'wait') el.className = 'wait' + (over ? ' alert' : '');
      else if (el.closest('li')) el.closest('li').classList.toggle('over', over);
    }
  });
  document.querySelectorAll('.c-now[data-start]').forEach(el => {
    const s = parse(el.dataset.start), e = parse(el.dataset.end);
    const left = mins(e, n), pct = Math.min(100, Math.max(0, 100 * mins(n, s) / Math.max(1, mins(e, s))));
    el.querySelector('.bar > i').style.width = pct + '%';
    el.querySelector('.left').textContent = left >= 0 ? short(left) + ' left' : '+' + short(-left) + ' late';
    if (left < 0 && !el.classList.contains('late')) {
      el.classList.replace('run', 'late');
      const cd = el.closest('.card');
      if (cd && cd.classList.contains('busy')) { cd.classList.replace('busy', 'late'); cd.querySelector('.st').textContent = LABEL.late; }
    }
  });
  const age = lastOk ? Math.round((Date.now() - lastOk) / 1000) : null;
  $('updated').textContent = age == null ? '' : `Updated ${age < 5 ? 'just now' : age + ' s ago'}`;
  $('dot').classList.toggle('stale', age == null || age > 3 * REFRESH / 1000);
}

// ── a wall screen: full screen on a click, kept awake where the browser allows ──
let wake = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') {
    wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; });
  } } catch (e) { wake = null; }
}
document.addEventListener('visibilitychange', keepAwake);
function syncFull() { $('full-btn').hidden = !!document.fullscreenElement || !document.documentElement.requestFullscreen; }
document.addEventListener('fullscreenchange', () => { syncFull(); refit(); });

// ── events ────────────────────────────────────────────────────────────────────
function toggleMod(m) {
  mods = !m ? [] : mods.includes(m) ? mods.filter(x => x !== m) : [...mods, m];
  store.set('mods', mods); render();
}
$('mod-chips').addEventListener('click', e => { const b = e.target.closest('[data-mod]'); if (b) toggleMod(b.dataset.mod); });
$('site-switch').addEventListener('click', e => {
  const b = e.target.closest('[data-site]');
  if (!b || (b.dataset.site === site && !split)) return;
  site = b.dataset.site; store.set('site', site);
  split = false; store.set('split', split);            // one hospital again
  closeDrawer(); load();
});
document.addEventListener('click', e => {
  const cd = e.target.closest('.card[data-room]');
  if (cd) { open = {room: cd.dataset.room, site: cd.dataset.site}; renderDrawer(); tick(); return; }
  if (e.target.closest('[data-save-limits]')) { saveLimits(); return; }
  if (e.target.closest('[data-close]')) closeDrawer();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && open) closeDrawer();
  const cd = e.target.closest && e.target.closest('.card[data-room]');
  if (cd && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open = {room: cd.dataset.room, site: cd.dataset.site}; renderDrawer(); tick(); }
});
$('names').addEventListener('click', () => { names = !names; store.set('names', names); render(); });
$('sites-btn').addEventListener('click', () => { split = !split; store.set('split', split); closeDrawer(); load(); });
$('full-btn').addEventListener('click', () => { const d = document.documentElement; if (d.requestFullscreen) d.requestFullscreen().catch(() => {}); });
if ($('limits-btn')) $('limits-btn').addEventListener('click', () => { open = {limits: true}; $('drawer').innerHTML = ''; renderDrawer(); });

syncFull();
keepAwake();
load();
setInterval(load, REFRESH);
setInterval(tick, 1000);
})();
</script>
