<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAYD | Live Department</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
    <style>
        :root {
            --bg: #0a0f0d; --panel: #111714; --panel-2: #172019; --line: #223029;
            --fg: #e6eee9; --muted: #8fa199; --faint: #5f7069;
            --free: #34d399; --free-soft: rgba(52,211,153,.12);
            --busy: #60a5fa; --busy-soft: rgba(96,165,250,.14);
            --over: #f87171; --over-soft: rgba(248,113,113,.14);
            --warn: #fbbf24; --warn-soft: rgba(251,191,36,.14);
            --closed: #64748b;
            --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        }
        body.light {
            --bg: #eef3f0; --panel: #ffffff; --panel-2: #f5f8f6; --line: #d6e0da;
            --fg: #18221d; --muted: #586a62; --faint: #8a9a93;
            --free: #047857; --free-soft: rgba(4,120,87,.10);
            --busy: #1d4ed8; --busy-soft: rgba(29,78,216,.10);
            --over: #b91c1c; --over-soft: rgba(185,28,28,.10);
            --warn: #b45309; --warn-soft: rgba(180,83,9,.12);
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.35 'Inter', system-ui, sans-serif; }
        button, select { font: inherit; color: inherit; }

        /* ── top bar: one row on a wall screen ── */
        .top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
               padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
        .top h1 { margin: 0; font-size: 16px; font-weight: 800; display: flex; gap: 7px; align-items: center; white-space: nowrap; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--free); box-shadow: 0 0 0 3px var(--free-soft); }
        .live-dot.stale { background: var(--over); box-shadow: 0 0 0 3px var(--over-soft); }
        .clock { font: 600 18px/1 var(--mono); }
        .date { color: var(--muted); font-size: 11px; }
        .kpis { display: flex; flex-wrap: wrap; gap: 6px; }
        .kpi { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; }
        .kpi b { font-size: 15px; font-variant-numeric: tabular-nums; margin-right: 5px; }
        .kpi .lbl { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
        .controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 2px 9px; cursor: pointer; font-size: 11.5px; }
        .chip[aria-pressed="true"] { border-color: var(--busy); color: var(--busy); background: var(--busy-soft); font-weight: 700; }
        .updated { color: var(--muted); font-size: 11px; min-width: 96px; text-align: right; }
        .banner { margin: 8px 12px 0; padding: 6px 10px; border-radius: 8px; background: var(--over-soft); color: var(--over); }

        /* ── the board: modalities across, devices down ── */
        main { padding: 10px 12px; display: grid; gap: 10px; align-items: start;
               grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); }
        .lane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px;
                display: flex; flex-direction: column; gap: 7px; min-width: 0; }
        .lane.wide { grid-column: span 2; }
        .lane.wide .devices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; align-items: start; }
        .devices { display: flex; flex-direction: column; gap: 7px; }
        .lane-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 9px; }
        .lane-head .mod { font-size: 20px; font-weight: 900; letter-spacing: -.02em; margin-right: 2px; }
        .lane-head .ls { color: var(--muted); font-size: 11px; white-space: nowrap; }
        .lane-head .ls b { color: var(--fg); font-variant-numeric: tabular-nums; }

        .card { background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--closed); border-radius: 8px;
                padding: 7px 8px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
        .card.free { border-left-color: var(--free); }
        .card.busy { border-left-color: var(--busy); }
        .card.overrun { border-left-color: var(--over); }
        .card.unassigned { border: 1px dashed var(--line); }
        .c-head { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
        .c-name { font-weight: 800; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .c-sub { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .pill { margin-left: auto; flex: none; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
                border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
        .pill.free { color: var(--free); background: var(--free-soft); }
        .pill.busy { color: var(--busy); background: var(--busy-soft); }
        .pill.overrun { color: var(--over); background: var(--over-soft); }
        .pill.closed { color: var(--closed); background: rgba(100,116,139,.15); }
        .flag { font-size: 9.5px; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 3px; flex: none; }
        .now { border-radius: 6px; padding: 5px 7px; background: var(--busy-soft); }
        .now.overrun { background: var(--over-soft); }
        .now .line1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .now .line1 b { font-weight: 700; }
        .now .line1 small { color: var(--muted); }
        .now .times { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; margin-top: 3px; font-variant-numeric: tabular-nums; }
        .now .left { font-weight: 800; white-space: nowrap; }
        .now.overrun .left { color: var(--over); }
        .bar { height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 3px; }
        .bar > i { display: block; height: 100%; background: var(--busy); border-radius: 99px; }
        .now.overrun .bar > i { background: var(--over); }
        .idle { font-size: 11.5px; color: var(--muted); }
        .sec-title { display: flex; justify-content: space-between; gap: 6px; font-size: 10px; text-transform: uppercase;
                     letter-spacing: .06em; color: var(--muted); font-weight: 700; }
        .list { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
        .list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; font-size: 12px; align-items: baseline; }
        .list .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .list .p small { color: var(--muted); font-size: 10.5px; }
        .wait { font: 700 11px/1 var(--mono); padding: 2px 5px; border-radius: 5px; background: var(--free-soft); color: var(--free); }
        .wait.warn { background: var(--warn-soft); color: var(--warn); }
        .wait.alert { background: var(--over-soft); color: var(--over); }
        .t { font: 11px/1 var(--mono); color: var(--muted); }
        .more { font-size: 10.5px; color: var(--faint); }
        .util { border-top: 1px solid var(--line); padding-top: 5px; }
        .util .row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); gap: 6px; }
        .util .row b { color: var(--fg); font-variant-numeric: tabular-nums; }
        .util .bar > i { background: var(--free); }
        .util .bar.over > i { background: var(--warn); }

        /* ── quiet devices: one line each ── */
        .q-mod { font-size: 10.5px; font-weight: 800; color: var(--muted); letter-spacing: .06em; margin-top: 3px; }
        .q-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; }
        .mini { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 6px; align-items: center;
                padding: 3px 6px; border-radius: 6px; background: var(--panel-2); font-size: 12px; }
        .mini .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--free); }
        .mini.closed { opacity: .6; } .mini.closed .dot { background: var(--closed); }
        .mini .m-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mini .m-name b { font-weight: 700; } .mini .m-name small { color: var(--muted); }
        .mini .m-right { font: 11px/1 var(--mono); color: var(--muted); white-space: nowrap; }
        .mini .m-right b { color: var(--fg); }

        .empty { color: var(--muted); padding: 40px; text-align: center; grid-column: 1 / -1; }
        .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 11px; padding: 0 12px 10px; }
        .legend i.sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
    </style>
</head>
<body class="{{ 'light' if ui_theme == 'light' }}">
<header class="top">
    <h1><span class="live-dot" id="dot" title="Live"></span> Live Department</h1>
    <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="controls">
        <div id="mod-chips" style="display:flex;flex-wrap:wrap;gap:5px"></div>
        <select class="chip" id="site" aria-label="Site" hidden></select>
        <button class="chip" id="names" type="button" aria-pressed="false" title="Show patient names or initials only">
            <i class="bi bi-eye-slash"></i> Initials</button>
        <span class="updated" id="updated"></span>
    </div>
</header>
<div class="banner" id="banner" hidden></div>
<main id="board"><div class="empty">Loading the department…</div></main>
<div class="legend">
    <span><i class="sw" style="background:var(--free)"></i>Free</span>
    <span><i class="sw" style="background:var(--busy)"></i>Busy (expected finish from the procedure duration)</span>
    <span><i class="sw" style="background:var(--over)"></i>Overrun (past its expected finish)</span>
    <span><i class="sw" style="background:var(--closed)"></i>Closed today</span>
    <span id="legend-wait"></span>
    <span>Utilization: busy time ÷ opening time so far today.</span>
    <span>Quiet now: nothing in progress, waiting or coming.</span>
</div>

<script>
(function () {
'use strict';
const REFRESH = {{ refresh_seconds|int }} * 1000;
const WIDE_AT = 4;                       // active cards from which a modality spans two columns
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const store = {
  get(k, d) { try { const v = localStorage.getItem('deptboard.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('deptboard.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
let B = null, offset = 0, lastOk = null, mods = store.get('mods', []), initials = store.get('initials', false);
let site = store.get('site', '');

// Server time is the hospital clock; the browser's may differ. Every countdown runs on
// server time = browser time + offset, measured at each fetch.
const serverNow = () => new Date(Date.now() + offset);
const parse = s => s ? new Date(s) : null;          // naive ISO = hospital local time
const hm = d => d ? d.toTimeString().slice(0, 5) : '';
const mins = (a, b) => (a - b) / 60000;
function dur(m) {
  m = Math.max(0, Math.round(m));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
}
function who(it) {
  const n = it.patient || '';
  if (!initials) return n;
  return n.split(/\s+/).filter(Boolean).map(w => w[0].toUpperCase() + '.').join(' ') || '—';
}
function waitLevel(m) {
  const t = B.thresholds;
  return m >= t.wait_alert_min ? 'alert' : m >= t.wait_warn_min ? 'warn' : '';
}
// A device with nothing in progress, waiting or coming takes one line, not a card.
const quiet = d => !d.current && !d.waiting.length && !d.incoming.length;

async function load() {
  try {
    const r = await fetch('/viewer/department/api/board' + (site ? '?site=' + encodeURIComponent(site) : ''),
                          {headers: {'Accept': 'application/json'}});
    if (r.status === 401 || r.redirected) { location.reload(); return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
    B = d; offset = parse(d.now) - Date.now(); lastOk = Date.now();
    $('banner').hidden = true;
    render();
  } catch (e) {
    $('banner').hidden = false;
    $('banner').textContent = 'The board could not be refreshed (' + e.message + '). ' +
      (lastOk ? 'Showing the data from ' + hm(new Date(lastOk + offset)) + '.' : '');
  }
}

function render() {
  if (!B) return;
  const t = B.totals;
  $('legend-wait').innerHTML = `<i class="sw" style="background:var(--warn)"></i>Waiting ≥ ${B.thresholds.wait_warn_min} min · <i class="sw" style="background:var(--over)"></i>≥ ${B.thresholds.wait_alert_min} min`;
  const kpi = (v, l) => `<div class="kpi"><b>${v}</b><span class="lbl">${esc(l)}</span></div>`;
  $('kpis').innerHTML = kpi(`${t.busy}/${t.devices}`, 'busy') + kpi(t.overrun, 'overrun') +
    kpi(t.waiting, 'waiting') +
    kpi(t.longest_wait_since ? `<span data-since="${esc(t.longest_wait_since)}">${dur(t.longest_wait_min)}</span>` : '—', 'longest wait') +
    kpi(t.incoming, 'coming') + kpi(t.done_today, 'done today') +
    kpi(t.utilization_pct == null ? '—' : t.utilization_pct + '%', 'utilization');

  const all = B.lanes.map(l => l.modality);
  mods = mods.filter(m => all.includes(m));
  $('mod-chips').innerHTML = `<button class="chip" type="button" data-mod="" aria-pressed="${!mods.length}">All</button>` +
    all.map(m => `<button class="chip" type="button" data-mod="${esc(m)}" aria-pressed="${mods.includes(m)}">${esc(m)}</button>`).join('');
  if (B.sites.length > 1) {
    $('site').hidden = false;
    $('site').innerHTML = '<option value="">All sites</option>' + B.sites.map(s =>
      `<option value="${esc(s.code)}"${s.code === site ? ' selected' : ''}>${esc(s.name)}</option>`).join('');
  }
  $('names').setAttribute('aria-pressed', String(initials));

  const lanes = B.lanes.filter(l => !mods.length || mods.includes(l.modality));
  const active = lanes.filter(l => l.devices.some(d => !quiet(d)) || l.unassigned);
  const calm = lanes.map(l => ({modality: l.modality, devices: l.devices.filter(quiet)}))
                    .filter(l => l.devices.length);
  const html = active.map(lane).join('') + (calm.length ? quietLane(calm) : '');
  $('board').innerHTML = html ||
    '<div class="empty">No devices to show. Devices come from Modality / Procedures (the AE map).</div>';
  tick();
}

function lane(l) {
  const s = l.summary;
  const cards = l.devices.filter(d => !quiet(d));
  const n = cards.length + (l.unassigned ? 1 : 0);
  const ls = (k, v) => `<span class="ls">${k} <b>${v}</b></span>`;
  return `<section class="lane${n >= WIDE_AT ? ' wide' : ''}" aria-label="${esc(l.modality)}">
    <div class="lane-head"><span class="mod">${esc(l.modality)}</span>
      ${ls('Busy', `${s.busy}/${s.devices}`)}${ls('Waiting', s.waiting)}
      ${s.longest_wait_since ? ls('Longest', `<span data-since="${esc(s.longest_wait_since)}">${dur(s.longest_wait_min)}</span>`) : ''}
      ${ls('Coming', s.incoming)}${ls('Done', s.done_today)}
      ${ls('Util', s.utilization_pct == null ? '—' : s.utilization_pct + '%')}</div>
    <div class="devices">${cards.map(device).join('')}${l.unassigned ? unassigned(l.unassigned) : ''}</div>
  </section>`;
}

function waitingList(items, max, clearsAt) {
  if (!items.length) return '';
  return `<div><div class="sec-title"><span>Waiting ${items.length}</span>${clearsAt ? `<span>clears ~${hm(parse(clearsAt))}</span>` : ''}</div>
    <ul class="list">${items.slice(0, max).map(w => `<li><span class="p">${esc(who(w))} <small>· ${esc(w.procedure)}</small></span>
      <span class="wait" data-since="${esc(w.arrived_at)}" data-fmt="wait">${dur(w.wait_min)}</span></li>`).join('')}</ul>
    ${items.length > max ? `<div class="more">+ ${items.length - max} more waiting</div>` : ''}</div>`;
}

function incomingList(items, max) {
  if (!items.length) return '';
  return `<div><div class="sec-title"><span>Coming ${items.length}</span><span>not arrived</span></div>
    <ul class="list">${items.slice(0, max).map(o => `<li><span class="p">${esc(who(o))} <small>· ${esc(o.procedure)}</small></span>
      <span class="t" title="${esc(o.state)}">${esc(o.state === 'Scheduled' ? 'sch ' : 'ord ')}${hm(parse(o.since))}</span></li>`).join('')}</ul>
    ${items.length > max ? `<div class="more">+ ${items.length - max} more coming</div>` : ''}</div>`;
}

const LABEL = {free: 'Free', busy: 'Busy', overrun: 'Overrun', closed: 'Closed'};
const subOf = d => [d.aetitle !== d.name ? d.aetitle : '', d.room, d.site_code].filter(Boolean).join(' · ');

function device(d) {
  let now = '';
  if (d.current) {
    const c = d.current;
    now = `<div class="now ${d.status}" data-start="${esc(c.started_at)}" data-end="${esc(c.expected_end)}">
      <div class="line1" title="${esc(c.procedure)}"><b>${esc(who(c))}</b> <small>· ${esc(c.procedure)}</small></div>
      <div class="bar"><i style="width:0%"></i></div>
      <div class="times"><span>${hm(parse(c.started_at))} → ~${hm(parse(c.expected_end))}${c.expected_source === 'default' ? ' <span title="No duration for this procedure: ' + c.expected_minutes + ' min assumed">*</span>' : ''}</span><span class="left"></span></div>
      ${d.also_in_progress ? `<div class="more">${d.also_in_progress} older study still open (no completion received).</div>` : ''}
    </div>`;
  } else if (d.status === 'closed') {
    now = `<div class="idle">Closed today${d.exception ? ' · ' + esc(d.exception) : ''}</div>`;
  } else {
    now = `<div class="idle">${d.last_done_at ? 'Free since ' + hm(parse(d.last_done_at)) : 'No study in progress'}</div>`;
  }
  const u = d.utilization_pct;
  return `<article class="card ${d.status}">
    <div class="c-head"><span class="c-name">${esc(d.name)}</span>${d.mapped ? '' : '<span class="flag" title="Sends messages but is not in the AE map">not mapped</span>'}
      <span class="c-sub">${esc(subOf(d))}</span><span class="pill ${d.status}">${LABEL[d.status]}</span></div>
    ${now}
    ${waitingList(d.waiting, 4, d.queue_clear_at)}
    ${incomingList(d.incoming, 2)}
    <div class="util">
      <div class="row"><span>Util <b>${u == null ? '—' : u + '%'}</b> · ${dur(d.busy_min)} / ${dur(d.open_min)}</span><span>Done <b>${d.done_today}</b></span></div>
      <div class="bar${u > 100 ? ' over' : ''}"><i style="width:${Math.min(100, u || 0)}%"></i></div>
    </div>
  </article>`;
}

function unassigned(u) {
  const inprog = u.in_progress.length ? `<div class="more">${u.in_progress.length} in progress with no device in the messages.</div>` : '';
  return `<article class="card unassigned">
    <div class="c-head"><span class="c-name">Not yet on a device</span></div>
    ${inprog}${waitingList(u.waiting, 4)}${incomingList(u.incoming, 4)}
  </article>`;
}

function quietLane(groups) {
  const n = groups.reduce((a, g) => a + g.devices.length, 0);
  const mini = d => {
    const u = d.utilization_pct;
    const tip = [subOf(d), d.status === 'closed' ? 'Closed today' + (d.exception ? ': ' + d.exception : '')
              : d.last_done_at ? 'Free since ' + hm(parse(d.last_done_at)) : 'Nothing today yet',
              `utilization ${u == null ? '—' : u + '%'}, ${d.done_today} done today`].filter(Boolean).join(' · ');
    return `<div class="mini ${d.status}" title="${esc(tip)}"><i class="dot"></i>
      <span class="m-name"><b>${esc(d.name)}</b>${d.mapped ? '' : ' <span class="flag">not mapped</span>'}</span>
      <span class="m-right">${d.status === 'closed' ? 'closed' : `<b>${u == null ? '—' : u + '%'}</b> · ${d.done_today}`}</span></div>`;
  };
  return `<section class="lane" aria-label="Quiet now">
    <div class="lane-head"><span class="mod">Quiet now</span><span class="ls"><b>${n}</b> devices · util · done</span></div>
    ${groups.map(g => `<div class="q-mod">${esc(g.modality)}</div><div class="q-grid">${g.devices.map(mini).join('')}</div>`).join('')}
  </section>`;
}

// Every second: the clock, every wait, every countdown and progress bar.
function tick() {
  const n = serverNow();
  $('clock').textContent = n.toTimeString().slice(0, 8);
  $('date').textContent = n.toLocaleDateString(undefined, {weekday: 'long', day: 'numeric', month: 'long'});
  document.querySelectorAll('[data-since]').forEach(el => {
    const m = mins(n, parse(el.dataset.since));
    el.textContent = dur(m);
    if (el.dataset.fmt === 'wait') el.className = 'wait ' + waitLevel(m);
  });
  document.querySelectorAll('.now[data-start]').forEach(el => {
    const s = parse(el.dataset.start), e = parse(el.dataset.end);
    const left = mins(e, n), pct = Math.min(100, Math.max(0, 100 * mins(n, s) / Math.max(1, mins(e, s))));
    el.querySelector('.bar > i').style.width = pct + '%';
    el.querySelector('.left').textContent = left >= 0 ? dur(left) + ' left' : '+' + dur(-left) + ' over';
    el.classList.toggle('overrun', left < 0);
    const card = el.closest('.card'), pill = card.querySelector('.pill');
    if (left < 0 && !card.classList.contains('overrun')) {
      card.classList.replace('busy', 'overrun'); pill.className = 'pill overrun'; pill.textContent = 'Overrun';
    }
  });
  const age = lastOk ? Math.round((Date.now() - lastOk) / 1000) : null;
  $('updated').textContent = age == null ? '' : `Updated ${age < 5 ? 'just now' : age + ' s ago'}`;
  $('dot').classList.toggle('stale', age == null || age > 3 * REFRESH / 1000);
}

$('mod-chips').addEventListener('click', e => {
  const b = e.target.closest('[data-mod]'); if (!b) return;
  const m = b.dataset.mod;
  mods = !m ? [] : mods.includes(m) ? mods.filter(x => x !== m) : [...mods, m];
  store.set('mods', mods); render();
});
$('site').addEventListener('change', e => { site = e.target.value; store.set('site', site); load(); });
$('names').addEventListener('click', () => { initials = !initials; store.set('initials', initials); render(); });

load();
setInterval(load, REFRESH);
setInterval(tick, 1000);
})();
</script>
</body>
</html>
