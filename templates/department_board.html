<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
    <title>RAYD | Live Department</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
    <style>
        :root {
            --bg: #0a0f0d; --panel: #111714; --panel-2: #172019; --line: #223029;
            --fg: #e6eee9; --muted: #8fa199; --faint: #5f7069;
            --free: #22c55e; --free-soft: rgba(34,197,94,.14);
            --busy: #3b82f6; --busy-soft: rgba(59,130,246,.16);
            --over: #ef4444; --over-soft: rgba(239,68,68,.16);
            --late: #f97316; --late-soft: rgba(249,115,22,.18);
            --early: #eab308; --early-soft: rgba(234,179,8,.18);
            --closed: #64748b;
            --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        }
        body.light {
            --bg: #eef3f0; --panel: #ffffff; --panel-2: #f5f8f6; --line: #d6e0da;
            --fg: #18221d; --muted: #586a62; --faint: #8a9a93;
            --free: #15803d; --busy: #1d4ed8; --over: #b91c1c; --late: #c2410c; --early: #a16207;
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { height: 100%; }
        body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.35 'Inter', system-ui, sans-serif;
               display: flex; flex-direction: column; overflow: hidden; }
        button, select, input { font: inherit; color: inherit; }
        .chart-info-icon { cursor: pointer; color: var(--muted); font-size: .8em; margin-left: 4px; }

        /* ── top bar ── */
        .top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 12px;
               background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
        .top h1 { margin: 0; font-size: 16px; font-weight: 800; display: flex; gap: 7px; align-items: center; white-space: nowrap; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--free); box-shadow: 0 0 0 3px var(--free-soft); }
        .live-dot.stale { background: var(--over); box-shadow: 0 0 0 3px var(--over-soft); }
        .clock { font: 600 18px/1 var(--mono); }
        .date { color: var(--muted); font-size: 11px; }
        .kpis { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .kpi { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; }
        .kpi b { font-size: 15px; font-variant-numeric: tabular-nums; margin-right: 5px; }
        .kpi .lbl { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
        .kpi.alert b { color: var(--over); } .kpi.late b { color: var(--late); }
        .controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 2px 9px; cursor: pointer; font-size: 11.5px; }
        .chip[aria-pressed="true"] { border-color: var(--busy); color: var(--busy); background: var(--busy-soft); font-weight: 700; }
        .site-switch { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
        .site-switch button { border: 0; background: var(--panel-2); padding: 3px 12px; cursor: pointer; font-weight: 700; font-size: 12px; }
        .site-switch button[aria-pressed="true"] { background: var(--busy); color: #fff; }
        .updated { color: var(--muted); font-size: 11px; min-width: 96px; text-align: right; }
        .banner { margin: 8px 12px 0; padding: 6px 10px; border-radius: 8px; background: var(--over-soft); color: var(--over); flex: none; }

        /* ── stage: the plan, and the rail beside it ── */
        .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 10px; padding: 10px; }
        .plan-box { position: relative; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
                    display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .plan { position: relative; flex: none; container-type: size; }
        .plan img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 6px; user-select: none; pointer-events: none; }
        body:not(.light) .plan img { filter: brightness(.82) contrast(1.05); }
        .plan-title { position: absolute; left: 12px; top: 8px; z-index: 2; font-size: 11px; color: var(--muted);
                      background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }

        /* a room: on the plan, in the rail, or in the tiles */
        .dev { position: absolute; transform: translate(-50%, -50%); width: 176px; font-size: 13px; text-align: left; cursor: pointer;
               background: var(--panel); border: 2px solid var(--closed); border-radius: .75em; padding: 0; overflow: hidden;
               box-shadow: 0 4px 16px rgba(0,0,0,.35); transition: opacity .2s; }
        .plan .dev { width: clamp(160px, 16cqw, 280px); font-size: clamp(12px, 1.05cqw, 19px); }
        .dev.static { position: relative; transform: none; width: auto; box-shadow: none; }
        .dev:focus-visible { outline: 3px solid var(--fg); }
        .dev.dim { opacity: .18; }
        .dev .d-top { display: flex; align-items: center; gap: .45em; padding: .3em .6em; background: var(--closed); color: #fff; }
        .dev .d-name { font-weight: 800; font-size: 1.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .dev .d-state { margin-left: auto; font-size: .74em; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; flex: none; }
        .dev .d-sub { font-size: .78em; color: var(--muted); padding: .15em .75em 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dev .d-main { font-weight: 700; font-size: .95em; margin: .15em .45em .25em; padding: .1em .3em; border-radius: .35em;
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
        .dev .d-main.late { background: var(--late-soft); color: var(--late); }
        .dev .d-main.early { background: var(--early-soft); color: var(--early); }
        .dev .d-stats { display: flex; gap: .3em; padding: 0 .45em .4em; }
        .st { flex: 1; display: flex; flex-direction: column; align-items: center; border-radius: .45em; background: var(--panel-2);
              padding: .15em 0; min-width: 0; }
        .st b { font-size: 1.18em; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .st small { font-size: .66em; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
        .st.alert { background: var(--over-soft); } .st.alert b, .st.alert small { color: var(--over); }
        .dev .d-util { height: .3em; min-height: 3px; background: var(--line); }
        .dev .d-util i { display: block; height: 100%; background: var(--free); }
        .dev.free { border-color: var(--free); } .dev.free .d-top { background: var(--free); }
        .dev.busy { border-color: var(--busy); } .dev.busy .d-top { background: var(--busy); }
        .dev.late { border-color: var(--late); } .dev.late .d-top { background: var(--late); }
        .dev.closed { opacity: .65; }

        .tiles { align-self: stretch; width: 100%; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .tiles .hint { color: var(--muted); font-size: 12px; }
        .tile-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: start; }
        .tile-row .mod { font-size: 20px; font-weight: 900; padding-top: 4px; }
        .tile-row .devs { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }

        /* ── rail ── */
        .rail { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
        .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
        .box h2 { margin: 0 0 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
        .mrow { display: grid; grid-template-columns: 38px repeat(4, minmax(0, 1fr)); gap: 4px; align-items: center; width: 100%;
                border: 0; background: transparent; padding: 3px 2px; border-radius: 6px; cursor: pointer; text-align: center; }
        .mrow:hover { background: var(--panel-2); }
        .mrow[aria-pressed="true"] { background: var(--busy-soft); }
        .mrow.head { cursor: default; font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
        .mrow.head:hover { background: transparent; }
        .mrow .m { font-weight: 900; text-align: left; font-size: 14px; }
        .mrow b { font-variant-numeric: tabular-nums; }
        .mrow .w.alert b { color: var(--over); }
        .mrow small { color: var(--muted); font-size: 10px; display: block; }
        .unplaced { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
        .linkbtn { border: 0; background: none; color: var(--busy); cursor: pointer; padding: 0; font-size: 11.5px; }
        .legend { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
        .legend i.sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
        .unknown { font-size: 11.5px; color: var(--muted); }

        /* ── details drawer ── */
        .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); z-index: 30; background: var(--panel);
                  border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.4); display: flex; flex-direction: column; }
        .dr-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
        .dr-head h3 { margin: 0; font-size: 18px; }
        .dr-head .sub { color: var(--muted); font-size: 12px; }
        .dr-close { margin-left: auto; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
        .dr-body { padding: 12px 14px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
        .dr-sec h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
                     display: flex; justify-content: space-between; }
        .now { border-radius: 8px; padding: 8px 10px; background: var(--busy-soft); }
        .now.late { background: var(--late-soft); }
        .now.early { background: var(--early-soft); }
        .now .who { font-weight: 800; font-size: 15px; }
        .now .what { color: var(--muted); }
        .now .times { display: flex; justify-content: space-between; margin-top: 6px; font-variant-numeric: tabular-nums; }
        .now .left { font-weight: 800; }
        .now.late .left { color: var(--late); }
        .now.early .who { color: var(--early); }
        .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 5px; }
        .bar > i { display: block; height: 100%; background: var(--busy); border-radius: 99px; }
        .now.late .bar > i { background: var(--late); }
        .ubar > i { background: var(--free); }
        .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
        .list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
                   padding: 4px 6px; border-radius: 6px; background: var(--panel-2); }
        .list .p b { font-weight: 700; } .list .p small { color: var(--muted); display: block; }
        .wait { font: 700 12px/1 var(--mono); padding: 3px 6px; border-radius: 6px; background: var(--free-soft); color: var(--free); white-space: nowrap; }
        .wait.alert { background: var(--over-soft); color: var(--over); }
        .t { font: 12px/1 var(--mono); color: var(--muted); white-space: nowrap; }
        .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
        .kv span { color: var(--muted); }
        .none { color: var(--muted); font-size: 12px; }
        .limits { display: grid; grid-template-columns: 1fr 90px; gap: 6px 10px; align-items: center; }
        .limits input { width: 90px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; text-align: right; }
        .btn { border: 0; border-radius: 8px; padding: 6px 14px; background: var(--busy); color: #fff; font-weight: 700; cursor: pointer; }
        .msg { font-size: 12px; } .msg.err { color: var(--over); } .msg.ok { color: var(--free); }
        @media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } body { overflow: auto; } }
    </style>
</head>
<body class="{{ 'light' if ui_theme == 'light' }}">
<header class="top">
    <h1><span class="live-dot" id="dot" title="Live"></span> Live Department<i class="bi bi-info-circle chart-info-icon" data-explain="live-board" role="button" tabindex="0" aria-label="About this board" title="About this board"></i></h1>
    <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
    <div class="kpis"><span id="kpis" class="kpis"></span><i class="bi bi-info-circle chart-info-icon" data-explain="live-board-kpis" role="button" tabindex="0" aria-label="About these figures" title="About these figures"></i></div>
    <div class="controls">
        <div class="site-switch" id="site-switch" role="group" aria-label="Hospital"></div>
        <div id="mod-chips" style="display:flex;flex-wrap:wrap;gap:5px"></div>
        <button class="chip" id="sites-btn" type="button" title="The hospitals side by side, per modality" hidden>
            <i class="bi bi-hospital"></i> Side by side</button>
        {% if can_edit_limits %}
        <button class="chip" id="limits-btn" type="button" title="Wait limit per modality, and when an exam is done too early">
            <i class="bi bi-sliders"></i> Limits</button>
        {% endif %}
        <button class="chip" id="names" type="button" aria-pressed="false" title="In the details: patient names or initials only">
            <i class="bi bi-eye-slash"></i> Initials</button>
        <span class="updated" id="updated"></span>
    </div>
</header>
<div class="banner" id="banner" hidden></div>
<div class="stage">
    <section class="plan-box" id="plan-box" aria-label="Department"><div class="none">Loading the department…</div></section>
    <aside class="rail" id="rail" aria-label="Modalities"></aside>
</div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="false" aria-labelledby="dr-title"></aside>

<script>
(function () {
'use strict';
const REFRESH = {{ refresh_seconds|int }} * 1000;
const STATIC = "{{ url_for('static', filename='') }}";
const CSRF = (document.querySelector('meta[name="csrf-token"]') || {}).content || '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const store = {
  get(k, d) { try { const v = localStorage.getItem('deptboard.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('deptboard.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
let B = null, offset = 0, lastOk = null, open = null;
let mods = store.get('mods', []), initials = store.get('initials', false), site = store.get('site', null);

// Server time is the hospital clock; the browser's may differ. Every countdown runs on
// server time = browser time + offset, measured at each fetch.
const serverNow = () => new Date(Date.now() + offset);
const parse = s => s ? new Date(s) : null;          // naive ISO = hospital local time
const hm = d => d ? d.toTimeString().slice(0, 5) : '';
const mins = (a, b) => (a - b) / 60000;
function dur(m) {
  m = Math.max(0, Math.round(m));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
}
const short = m => { m = Math.max(0, Math.round(m)); return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`; };
function who(it) {
  const n = it.patient || '';
  if (!initials) return n;
  return n.split(/\s+/).filter(Boolean).map(w => w[0].toUpperCase() + '.').join(' ') || '—';
}
const LABEL = {free: 'Free', busy: 'Busy', late: 'Late', closed: 'Closed'};
const SOURCE = {booked: 'booked on the RIS', procedure: 'the procedure’s usual duration',
                modality: 'the modality’s usual duration (none for the procedure)', default: 'a default (no duration known)'};
const allRooms = () => B.lanes.flatMap(l => l.rooms);
const shown = r => !mods.length || mods.includes(r.modality);

async function load() {
  try {
    const q = site ? '?site=' + encodeURIComponent(site) : '';
    const r = await fetch('/viewer/department/api/board' + q, {headers: {'Accept': 'application/json'}});
    if (r.status === 401 || r.redirected) { location.reload(); return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
    B = d; offset = parse(d.now) - Date.now(); lastOk = Date.now();
    if (d.site && d.site !== site) { site = d.site; store.set('site', site); }   // remembered on this screen
    $('banner').hidden = true;
    render();
    if (open && open.sites) loadSites();
  } catch (e) {
    $('banner').hidden = false;
    $('banner').textContent = 'The board could not be refreshed (' + e.message + '). ' +
      (lastOk ? 'Showing the data from ' + hm(new Date(lastOk + offset)) + '.' : '');
  }
}

// ── one room card ─────────────────────────────────────────────────────────────
function mainLine(r) {
  const c = r.current;
  if (c) return `<div class="d-main${c.late ? ' late' : ''}" data-end="${esc(c.expected_end)}">ends ${hm(parse(c.expected_end))}</div>`;
  if (r.early) return `<div class="d-main early" title="Marked done sooner than ${B.limits.early_pct} % of its expected time">done in ${short(r.early.took_min)} of ${short(r.early.expected_minutes)}</div>`;
  if (r.status === 'closed') return '<div class="d-main">Closed today</div>';
  return `<div class="d-main">${r.last_done_at ? 'free since ' + hm(parse(r.last_done_at)) : 'free'}</div>`;
}
function badge(r, where) {
  const w = r.waiting.length, first = r.waiting[0], u = r.utilization_pct;
  const pos = where === 'plan' ? ` style="left:${r.x}%;top:${r.y}%"` : '';
  return `<button type="button" class="dev ${r.status}${where === 'plan' ? '' : ' static'}${shown(r) ? '' : ' dim'}"${pos}
      data-room="${esc(r.key)}" title="${esc(r.room)} · ${esc(r.room_code)} — click for details">
    <div class="d-top"><span class="d-name">${esc(r.room)}</span><span class="d-state">${LABEL[r.status]}</span></div>
    <div class="d-sub">${esc(r.room_code)} · ${esc(r.modality)}</div>
    ${mainLine(r)}
    <div class="d-stats">
      <span class="st" title="Booked on this room today, and how many have not arrived"><b>${r.scheduled_today}</b><small>${r.to_come} to come</small></span>
      <span class="st ${r.waiting_over ? 'alert' : ''}" title="Arrived, not started; red past ${r.wait_limit_min} min"><b>${w}</b><small>${w ? `wait <span data-since="${esc(first.arrived_at)}" data-fmt="short">${short(first.wait_min)}</span>` : 'arrived'}</small></span>
      <span class="st" title="Utilization so far today"><b>${u == null ? '—' : u + '%'}</b><small>util</small></span>
    </div>
    <div class="d-util"><i style="width:${Math.min(100, u || 0)}%"></i></div>
  </button>`;
}

// ── render ────────────────────────────────────────────────────────────────────
function render() {
  if (!B) return;
  const t = B.totals;
  const kpi = (v, l, cls) => `<div class="kpi ${cls || ''}"><b>${v}</b><span class="lbl">${esc(l)}</span></div>`;
  $('kpis').innerHTML = kpi(`${t.busy}/${t.rooms}`, 'busy') + kpi(t.late, 'late', t.late ? 'late' : '') +
    kpi(t.waiting + (t.waiting_over ? ` <small>(${t.waiting_over} over)</small>` : ''), 'arrived', t.waiting_over ? 'alert' : '') +
    kpi(t.longest_wait_since ? `<span data-since="${esc(t.longest_wait_since)}">${dur(t.longest_wait_min)}</span>` : '—', 'longest wait') +
    kpi(`${t.scheduled_today} <small>(${t.to_come} to come)</small>`, 'scheduled') + kpi(t.done_today, 'done today') +
    kpi(t.utilization_pct == null ? '—' : t.utilization_pct + '%', 'utilization');

  $('site-switch').innerHTML = B.sites.map(s =>
    `<button type="button" data-site="${esc(s.code)}" aria-pressed="${s.code === B.site}" title="${esc(s.name)}">${esc(s.code)}</button>`).join('');
  $('sites-btn').hidden = B.sites.length < 2;
  const all = B.lanes.map(l => l.modality);
  mods = mods.filter(m => all.includes(m));
  $('mod-chips').innerHTML = `<button class="chip" type="button" data-mod="" aria-pressed="${!mods.length}">All</button>` +
    all.map(m => `<button class="chip" type="button" data-mod="${esc(m)}" aria-pressed="${mods.includes(m)}">${esc(m)}</button>`).join('');
  $('names').setAttribute('aria-pressed', String(initials));

  const plan = B.plans.find(p => p.site_code === B.site);
  const rooms = allRooms();
  const onPlan = plan ? rooms.filter(r => r.x != null) : [];
  const offPlan = rooms.filter(r => !onPlan.includes(r));

  if (plan) {
    $('plan-box').innerHTML = `<div class="plan-title">${esc(plan.site_name)} · floor plan</div>
      <div class="plan" id="plan" data-w="${plan.width || 1600}" data-h="${plan.height || 900}">
        <img src="${esc(STATIC + plan.image_path)}" alt="">${onPlan.map(r => badge(r, 'plan')).join('')}</div>`;
    if (!plan.width || !plan.height) {           // size not stored at upload: read it off the image
      const img = $('plan').querySelector('img');
      img.addEventListener('load', () => {
        $('plan').dataset.w = img.naturalWidth; $('plan').dataset.h = img.naturalHeight; fitPlan();
      }, {once: true});
    }
    fitPlan();
  } else {
    $('plan-box').innerHTML = `<div class="tiles">
      ${rooms.length ? '' : '<div class="hint">No room of this hospital is open today or has anything booked.</div>'}
      ${B.lanes.map(l => `<div class="tile-row"><div class="mod">${esc(l.modality)}</div>
        <div class="devs">${l.rooms.map(r => badge(r, 'tile')).join('')}</div></div>`).join('')}</div>`;
  }
  renderRail(plan ? offPlan : []);
  if (open) renderDrawer();
  tick();
}

function fitPlan() {
  const box = $('plan-box'), p = $('plan');
  if (!p) return;
  const W = +p.dataset.w, H = +p.dataset.h, pad = 20;
  const s = Math.min((box.clientWidth - pad) / W, (box.clientHeight - pad) / H);
  p.style.width = Math.max(100, W * s) + 'px';
  p.style.height = Math.max(60, H * s) + 'px';
}
window.addEventListener('resize', fitPlan);

function renderRail(offPlan) {
  const rows = B.lanes.map(l => {
    const s = l.summary;
    return `<button type="button" class="mrow" data-mod="${esc(l.modality)}" aria-pressed="${mods.includes(l.modality)}" title="Show only ${esc(l.modality)}">
      <span class="m">${esc(l.modality)}</span>
      <span><b>${s.busy}/${s.rooms}</b><small>busy</small></span>
      <span class="w ${s.waiting_over ? 'alert' : ''}"><b>${s.waiting}</b><small>${s.longest_wait_since ? `<span data-since="${esc(s.longest_wait_since)}" data-fmt="short">${short(s.longest_wait_min)}</span>` : 'arrived'}</small></span>
      <span><b>${s.scheduled_today}</b><small>sched.</small></span>
      <span><b>${s.utilization_pct == null ? '—' : s.utilization_pct + '%'}</b><small>util</small></span>
    </button>`;
  }).join('');
  const off = offPlan.filter(shown);
  const un = B.unknown_rooms;
  $('rail').innerHTML = `
    <div class="box"><h2>By modality</h2>
      <div class="mrow head"><span></span><span>busy</span><span>arrived</span><span>sched.</span><span>util</span></div>${rows || '<div class="none">No room today.</div>'}</div>
    ${off.length ? `<div class="box"><h2>Not on the plan (${off.length})</h2><div class="unplaced">${off.map(r => badge(r, 'rail')).join('')}</div></div>` : ''}
    ${un.length ? `<div class="box"><h2>Rooms not in RAYD's room list</h2><div class="unknown">The RIS named these rooms, which no RIS room in RAYD has (the room list is copied every night): ${un.map(u => `<b>${esc(u.code)}</b> (${u.studies})`).join(', ')}.</div></div>` : ''}
    <div class="box legend">
      <span><i class="sw" style="background:var(--free)"></i>Free · <i class="sw" style="background:var(--busy)"></i>Busy · <i class="sw" style="background:var(--late)"></i>Late: running past its expected end · <i class="sw" style="background:var(--closed)"></i>Closed today</span>
      <span><i class="sw" style="background:var(--early)"></i>Done too early: the last exam took less than ${B.limits.early_pct} % of its expected time, until the next one starts.</span>
      <span><i class="sw" style="background:var(--over)"></i>Arrived patients: red past the wait limit (${Object.entries(B.limits.wait_min).map(([m, v]) => `${esc(m)} ${v}`).join(', ') || 'none set'}; otherwise ${B.limits.default_wait_min} min).</span>
      <span>Expected end = start + the minutes booked on the RIS. Utilization: busy time ÷ opening time so far today. Click a room for its patients.</span>
    </div>`;
}

// ── details ───────────────────────────────────────────────────────────────────
function waitList(items, limit) {
  if (!items.length) return '<div class="none">Nobody waiting.</div>';
  return `<ul class="list">${items.map(x => `<li><span class="p"><b>${esc(who(x))}</b><small>${esc(x.procedure)}${x.appointment_at ? ' · booked ' + hm(parse(x.appointment_at)) : ''} · arrived ${hm(parse(x.arrived_at))}</small></span>
    <span class="wait${x.over ? ' alert' : ''}" data-since="${esc(x.arrived_at)}" data-fmt="wait" data-limit="${limit}">${dur(x.wait_min)}</span></li>`).join('')}</ul>`;
}
function comingList(items) {
  if (!items.length) return '<div class="none">Nobody else booked today.</div>';
  return `<ul class="list">${items.map(x => `<li><span class="p"><b>${esc(who(x))}</b><small>${esc(x.procedure)}</small></span>
    <span class="t">${hm(parse(x.appointment_at))}</span></li>`).join('')}</ul>`;
}

// ── the hospitals side by side, per modality (item 13b) ────────────────────────
let S = null;
async function loadSites() {
  try {
    const r = await fetch('/viewer/department/api/sites', {headers: {'Accept': 'application/json'}});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
    S = d;
  } catch (e) { S = {error: e.message}; }
  if (open && open.sites) renderDrawer();
}
function sitesHtml() {
  if (!S) return '<div class="none">Loading the hospitals…</div>';
  if (S.error) return `<div class="none">The hospitals could not be read (${esc(S.error)}).</div>`;
  if (!S.sites.length) return '<div class="none">Your account holds one hospital.</div>';
  const cell = v => `<td style="text-align:right;padding:3px 6px;font-variant-numeric:tabular-nums">${v}</td>`;
  const one = s => !s ? cell('—') + cell('—') + cell('—') + cell('—') :
    cell(`${s.busy}/${s.rooms}`) + cell(s.waiting) + cell(s.done_today) +
    cell(s.utilization_pct == null ? '—' : s.utilization_pct + '%');
  const head = S.sites.map(s => `<th colspan="4" style="padding:4px 6px;text-align:center">${esc(s.code)}</th>`).join('');
  const sub = S.sites.map(() => ['Busy', 'Arrived', 'Done', 'Util.']
    .map(h => `<th style="padding:2px 6px;text-align:right;font-size:10px;opacity:.7">${h}</th>`).join('')).join('');
  const rows = S.modalities.map(m => `<tr><td style="padding:3px 6px;font-weight:800">${esc(m.modality)}</td>` +
    S.sites.map(s => one(m.by_site[s.code])).join('') + '</tr>').join('');
  const total = '<tr style="border-top:1px solid currentColor;font-weight:800"><td style="padding:3px 6px">All</td>' +
    S.sites.map(s => one(S.totals[s.code])).join('') + '</tr>';
  return `<table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead><tr><th></th>${head}</tr><tr><th style="text-align:left;padding:2px 6px;font-size:10px;opacity:.7">Modality</th>${sub}</tr></thead>
    <tbody>${rows}${total}</tbody></table>
    <div class="none" style="margin-top:8px">Each hospital counted the same way. Busy = rooms with an exam running / rooms shown.</div>`;
}

function limitsHtml() {
  const L = B.limits;
  const mods_ = Object.keys(L.wait_min);
  return `<div class="dr-sec"><h4><span>Wait limit per modality (minutes)</span></h4>
      <div class="limits">${mods_.map(m => `<label for="lim-${esc(m)}">${esc(m)}</label><input id="lim-${esc(m)}" type="number" min="1" max="600" data-mod="${esc(m)}" value="${L.wait_min[m]}">`).join('')}
        <label for="lim-default">Any other modality</label><input id="lim-default" type="number" min="1" max="600" value="${L.default_wait_min}"></div></div>
    <div class="dr-sec"><h4><span>Done too early</span></h4>
      <div class="limits"><label for="lim-early">Under this share of the expected time (%)</label><input id="lim-early" type="number" min="1" max="99" value="${L.early_pct}"></div></div>
    <div style="display:flex;gap:10px;align-items:center"><button class="btn" type="button" data-save-limits>Save</button><span class="msg" id="lim-msg"></span></div>
    <div class="none">Applies to every screen showing the board, for both hospitals, from the next refresh.</div>`;
}
async function saveLimits() {
  const wait = {};
  document.querySelectorAll('.limits input[data-mod]').forEach(i => { if (i.value) wait[i.dataset.mod] = +i.value; });
  const body = {wait_min: wait, default_wait_min: +$('lim-default').value, early_pct: +$('lim-early').value};
  const msg = $('lim-msg');
  try {
    const r = await fetch('/viewer/department/api/limits', {method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF}, body: JSON.stringify(body)});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
    msg.className = 'msg ok'; msg.textContent = 'Saved.';
    load();
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
}

function renderDrawer() {
  let html;
  if (open.sites) {
    html = `<div class="dr-head"><div><h3 id="dr-title">Hospitals side by side</h3>
        <div class="sub">Per modality, now</div></div>
        <button class="dr-close" type="button" data-close>Close</button></div>
      <div class="dr-body"><div class="dr-sec">${sitesHtml()}</div></div>`;
  } else if (open.limits) {
    if ($('drawer').querySelector('[data-save-limits]')) return;       // keep what is being typed
    html = `<div class="dr-head"><div><h3 id="dr-title">Limits</h3>
        <div class="sub">When a wait turns red, and when an exam counts as done too early</div></div>
        <button class="dr-close" type="button" data-close>Close</button></div>
      <div class="dr-body">${limitsHtml()}</div>`;
  } else {
    const r = allRooms().find(x => x.key === open.room);
    if (!r) { closeDrawer(); return; }
    const c = r.current, e = r.early, u = r.utilization_pct;
    const now = c ? `<div class="now ${c.late ? 'late' : ''}" data-start="${esc(c.started_at)}" data-end="${esc(c.expected_end)}">
        <div class="who">${esc(who(c))}</div><div class="what">${esc(c.procedure)}${c.accession ? ' · ' + esc(c.accession) : ''}</div>
        <div class="bar"><i style="width:0%"></i></div>
        <div class="times"><span>Started ${hm(parse(c.started_at))} · expected end ${hm(parse(c.expected_end))}</span><span class="left"></span></div>
        <div class="none" style="margin-top:4px">${c.expected_minutes} min: ${SOURCE[c.expected_source]}</div>
        ${r.also_in_progress ? `<div class="none">${r.also_in_progress} older exam still open: no completion received.</div>` : ''}</div>`
      : `<div class="none">${r.status === 'closed' ? 'Closed today' + (r.exception ? ': ' + esc(r.exception) : '') : r.last_done_at ? 'Free since ' + hm(parse(r.last_done_at)) : 'No exam running.'}</div>`;
    const early = e ? `<div class="dr-sec"><h4><span>Last exam done too early</span></h4><div class="now early">
        <div class="who">${esc(who(e))}</div><div class="what">${esc(e.procedure)}</div>
        <div class="times"><span>${hm(parse(e.started_at))} → ${hm(parse(e.done_at))}</span><span class="left">${dur(e.took_min)} of ${dur(e.expected_minutes)}</span></div></div></div>` : '';
    html = `<div class="dr-head"><div><h3 id="dr-title">${esc(r.room)}</h3>
        <div class="sub">${esc([r.room_code, r.modality, r.site].filter(Boolean).join(' · '))}</div></div>
        <span class="chip" style="cursor:default">${LABEL[r.status]}</span>
        <button class="dr-close" type="button" data-close>Close</button></div>
      <div class="dr-body">
        <div class="dr-sec"><h4><span>In the room</span></h4>${now}</div>
        ${early}
        <div class="dr-sec"><h4><span>Arrived, waiting ${r.waiting.length}</span><span>red past ${r.wait_limit_min} min</span></h4>${waitList(r.waiting, r.wait_limit_min)}</div>
        <div class="dr-sec"><h4><span>Still to come today ${r.to_come}</span><span>${r.scheduled_today} booked today</span></h4>${comingList(r.coming)}</div>
        <div class="dr-sec"><h4><span>Utilization so far today</span><span>${u == null ? '—' : u + '%'}</span></h4>
          <div class="bar ubar"><i style="width:${Math.min(100, u || 0)}%"></i></div>
          <div class="kv" style="margin-top:8px">
            <span>Busy</span><b>${dur(r.busy_min)}</b>
            <span>Open so far</span><b>${dur(r.open_min)} of ${dur(r.opening_minutes)} today, from ${hm(parse(r.window_start))}</b>
            <span>Done today</span><b>${r.done_today}</b>
          </div></div>
      </div>`;
  }
  $('drawer').innerHTML = html;
  // Below the top bar, so the clock, filters and the initials toggle stay usable.
  $('drawer').style.top = document.querySelector('.top').offsetHeight + 'px';
  $('drawer').hidden = false;
}
function closeDrawer() { open = null; $('drawer').hidden = true; $('drawer').innerHTML = ''; }

// ── every second: clock, waits, countdowns ────────────────────────────────────
function tick() {
  const n = serverNow();
  $('clock').textContent = n.toTimeString().slice(0, 8);
  $('date').textContent = n.toLocaleDateString(undefined, {weekday: 'long', day: 'numeric', month: 'long'});
  document.querySelectorAll('[data-since]').forEach(el => {
    const m = mins(n, parse(el.dataset.since));
    el.textContent = el.dataset.fmt === 'short' ? short(m) : dur(m);
    if (el.dataset.fmt === 'wait') el.className = 'wait' + (m >= +el.dataset.limit ? ' alert' : '');
  });
  document.querySelectorAll('.dev [data-end]').forEach(el => {
    const left = mins(parse(el.dataset.end), n);
    el.textContent = left >= 0 ? `ends ${hm(parse(el.dataset.end))} · ${short(left)}` : `+${short(-left)} late`;
    const dev = el.closest('.dev');
    if (left < 0 && dev.classList.contains('busy')) {
      dev.classList.replace('busy', 'late'); el.classList.add('late');
      dev.querySelector('.d-state').textContent = LABEL.late;
    }
  });
  document.querySelectorAll('.now[data-start]').forEach(el => {
    const s = parse(el.dataset.start), e = parse(el.dataset.end);
    const left = mins(e, n), pct = Math.min(100, Math.max(0, 100 * mins(n, s) / Math.max(1, mins(e, s))));
    el.querySelector('.bar > i').style.width = pct + '%';
    el.querySelector('.left').textContent = left >= 0 ? dur(left) + ' left' : '+' + dur(-left) + ' late';
    el.classList.toggle('late', left < 0);
  });
  const age = lastOk ? Math.round((Date.now() - lastOk) / 1000) : null;
  $('updated').textContent = age == null ? '' : `Updated ${age < 5 ? 'just now' : age + ' s ago'}`;
  $('dot').classList.toggle('stale', age == null || age > 3 * REFRESH / 1000);
}

// ── events ────────────────────────────────────────────────────────────────────
function toggleMod(m) {
  mods = !m ? [] : mods.includes(m) ? mods.filter(x => x !== m) : [...mods, m];
  store.set('mods', mods); render();
}
$('mod-chips').addEventListener('click', e => { const b = e.target.closest('[data-mod]'); if (b) toggleMod(b.dataset.mod); });
$('site-switch').addEventListener('click', e => {
  const b = e.target.closest('[data-site]');
  if (!b || b.dataset.site === site) return;
  site = b.dataset.site; store.set('site', site); closeDrawer(); load();
});
document.addEventListener('click', e => {
  const dev = e.target.closest('.dev[data-room]');
  if (dev) { open = {room: dev.dataset.room}; renderDrawer(); tick(); return; }
  const row = e.target.closest('.mrow[data-mod]');
  if (row) { toggleMod(row.dataset.mod); return; }
  if (e.target.closest('[data-save-limits]')) { saveLimits(); return; }
  if (e.target.closest('[data-close]')) closeDrawer();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) closeDrawer(); });
$('names').addEventListener('click', () => { initials = !initials; store.set('initials', initials); render(); });
$('sites-btn').addEventListener('click', () => { open = {sites: true}; renderDrawer(); loadSites(); });
if ($('limits-btn')) $('limits-btn').addEventListener('click', () => { open = {limits: true}; $('drawer').innerHTML = ''; renderDrawer(); });

load();
setInterval(load, REFRESH);
setInterval(tick, 1000);
})();
</script>
<script src="{{ url_for('static', filename='js/chart-explanations.js') }}"></script>
</body>
</html>
