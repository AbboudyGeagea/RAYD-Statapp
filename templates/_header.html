<!-- Security: CSRF token for AJAX requests -->
<meta name="csrf-token" content="{{ csrf_token() }}">
<script>
// ── HTML escaping helper (prevents DOM-XSS in all templates) ─────────────
function escHtml(v) {
    if (v == null) return '';
    return String(v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

// ── CSRF: inject X-CSRFToken header into every mutating fetch() call ─────
(function() {
    const _origFetch = window.fetch;
    window.fetch = function(url, options) {
        options = options || {};
        const method = (options.method || 'GET').toUpperCase();
        if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method)) {
            const token = document.querySelector('meta[name="csrf-token"]');
            if (token) {
                options.headers = Object.assign({}, options.headers, {
                    'X-CSRFToken': token.content
                });
            }
        }
        return _origFetch.call(this, url, options);
    };
})();

// ── CSRF: auto-inject hidden token into every POST form on the page ───────
document.addEventListener('DOMContentLoaded', function() {
    const token = document.querySelector('meta[name="csrf-token"]');
    if (!token) return;
    document.querySelectorAll('form').forEach(function(form) {
        const m = (form.getAttribute('method') || 'GET').toUpperCase();
        if (m === 'POST' && !form.querySelector('input[name="csrf_token"]')) {
            const inp = document.createElement('input');
            inp.type = 'hidden';
            inp.name = 'csrf_token';
            inp.value = token.content;
            form.appendChild(inp);
        }
    });
});
</script>
{% if demo_mode %}
<div style="background:rgba(245,158,11,0.12);border-bottom:1px solid rgba(245,158,11,0.3);padding:5px 24px;display:flex;align-items:center;justify-content:center;gap:10px;z-index:40;position:relative;">
    <span style="font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:0.2em;color:#f59e0b;background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);padding:2px 8px;border-radius:4px;">DEMO</span>

</div>

<header class="bg-[#232b28] border-b border-[#28332e] px-6 py-3 flex items-center justify-between shadow-md z-30 relative flex-shrink-0">
    <!-- Left: Logo -->
    <div class="flex items-center gap-3">
        <button onclick="printMainContent()" title="Print / Export PDF"
            class="p-2 rounded-lg hover:bg-[#2a3530] transition-colors text-[#34d399] text-lg">
            <i class="bi bi-printer-fill"></i>
        </button>
        <a href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='RAYD.png') }}" class="h-14 w-auto" style="background:white; border-radius:8px; padding:3px;">
        </a>
    </div>

    <!-- Right: Tagline between two blue lines + theme toggle -->
    <div class="flex items-center gap-4">
        <div class="flex flex-col items-end gap-1.5">
            <div class="h-px w-64 bg-[#60a5fa] opacity-70"></div>
            <p class="text-[11px] font-black tracking-[0.2em] uppercase text-[#60a5fa]">Welcome, {{ current_user.username }}</p>
            <div class="h-px w-64 bg-[#60a5fa] opacity-70"></div>
        </div>
        <button onclick="toggleTheme()" title="Toggle light/dark mode"
            class="p-2 rounded-lg hover:bg-[#2a3530] transition-colors text-[#60a5fa] text-lg">
            <i id="theme-icon" class="bi bi-moon-fill"></i>
        </button>
    </div>
</header>
<style>

    header, aside { display: none !important; }
    body {
        display: block !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        background: white !important;
        color: black !important;

    }
    main {

        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        padding: 0 !important;
    }
}
</style>
<script>
// ── Print main content only ───────────────────────────────────────────────
// Prints the report on A4 landscape at its on-screen size. Nothing may be wider
// than the paper: Chrome then shrinks the whole page, numbers included, which
// made printed reports unreadable. So every chart is redrawn at the width it gets
// on paper and placed as a sharp image (3x), and tables and scroll boxes unfold
// to the page width.
const PRINT_WIDTH_PX = 1047;     // A4 landscape: 297 mm less 2 x 10 mm margins, at 96 px per inch
const PRINT_HEIGHT_PX = 718;     // 210 mm less 2 x 10 mm
const PRINT_PIXEL_RATIO = 3;
const PRINT_CSS = `
@page { size: A4 landscape; margin: 10mm; }
* { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.rayd-print-main { display: block !important; height: auto !important; overflow: visible !important; padding: 0 !important; }
img.rayd-print-chart { display: block; width: 100%; height: auto; }
.rayd-print-box { height: auto !important; min-height: 0 !important; }
img, svg, canvas, table, pre { max-width: 100% !important; }
table { width: 100% !important; }
th, td { white-space: normal !important; overflow-wrap: break-word; }
[class*="overflow-"], [style*="overflow"] { overflow: visible !important; }
[class*="max-h-"], [style*="max-height"] { max-height: none !important; }
button { display: none !important; }
tr, .rayd-print-box, [data-rayd-print-keep] { break-inside: avoid; }
`;

function _printChartImages(main) {
    // Map of chart element -> {url, width}: ECharts containers and Chart.js / plain canvases.
    const contentW = Math.max(1, ...[...main.children].map(c => c.offsetWidth));
    const s = Math.min(1, PRINT_WIDTH_PX / contentW);
    const shots = new Map();
    main.querySelectorAll('[_echarts_instance_]').forEach(el => {
        const inst = window.echarts && echarts.getInstanceByDom(el);
        if (!inst || !el.offsetWidth) return;
        const width = Math.round(el.offsetWidth * s), still = { animation: { duration: 0 } };
        inst.resize({ width: width, height: el.offsetHeight, ...still });
        shots.set(el, { url: inst.getDataURL({ type: 'png', pixelRatio: PRINT_PIXEL_RATIO }), width: width });
        inst.resize(still);
    });
    main.querySelectorAll('canvas').forEach(cv => {
        if (!cv.offsetWidth || cv.closest('[_echarts_instance_]')) return;
        const chart = window.Chart && Chart.getChart && Chart.getChart(cv);
        const width = Math.round(cv.offsetWidth * s);
        if (!chart) {
            try { shots.set(cv, { url: cv.toDataURL('image/png'), width: width }); } catch (e) { /* tainted */ }
            return;
        }
        const ratio = chart.config.options.devicePixelRatio, height = cv.offsetHeight;
        chart.stop();                                  // a running animation would be captured half-drawn
        chart.config.options.devicePixelRatio = PRINT_PIXEL_RATIO;
        chart.update('none');
        chart.resize(width, height);
        chart.update('none');
        shots.set(cv, { url: chart.toBase64Image(), width: width });
        if (ratio === undefined) delete chart.config.options.devicePixelRatio;
        else chart.config.options.devicePixelRatio = ratio;
        chart.update('none');
        chart.resize();
    });
    return shots;
}

function _printDocument(main) {
    const shots = _printChartImages(main);
    // Keep each chart on one page with its title: mark its largest ancestor that fits a page.
    const kept = [...shots.keys()].map(el => {
        let box = el;
        while (box.parentElement && box.parentElement !== main && box.parentElement.offsetHeight <= PRINT_HEIGHT_PX)
            box = box.parentElement;
        box.setAttribute('data-rayd-print-keep', '');
        return box;
    });
    const clone = main.cloneNode(true);
    kept.forEach(box => box.removeAttribute('data-rayd-print-keep'));
    const selector = '[_echarts_instance_], canvas';
    const copies = clone.querySelectorAll(selector);
    main.querySelectorAll(selector).forEach((orig, i) => {
        const shot = shots.get(orig);
        if (!shot) return;
        const img = document.createElement('img');
        img.src = shot.url;
        img.className = 'rayd-print-chart';
        img.style.maxWidth = shot.width + 'px';
        if (orig.tagName === 'CANVAS') copies[i].replaceWith(img);
        else { copies[i].replaceChildren(img); copies[i].classList.add('rayd-print-box'); }
    });
    clone.classList.add('rayd-print-main');
    const styles = [...document.querySelectorAll('link[rel="stylesheet"], style')]
        .map(el => el.outerHTML).join('\n');
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + document.title + '</title>' + styles +
        '<style>' + PRINT_CSS + 'body{background:' + getComputedStyle(main).backgroundColor + ';}</style>' +
        '</head><body class="' + document.body.className + '">' + clone.outerHTML + '</body></html>';
}

function printMainContent() {
    const main = document.querySelector('main');
    if (!main) { window.print(); return; }
    const html = _printDocument(main);
    const pw = window.open('', '_blank', 'width=1100,height=800');
    pw.document.write(html);
    pw.document.close();
    pw.focus();
    pw.onload = function() { pw.print(); };
}

// ── Async filter-option loader ────────────────────────────────────────────
// Called once per page. Fetches /api/filter-options (server-cached 5 min),
// then populates every <select data-filter-key="KEY"> on the page.
// Selected values that were POSTed back are preserved via data-selected.
document.addEventListener('DOMContentLoaded', function () {
    const selects = document.querySelectorAll('select[data-filter-key]');
    if (!selects.length) return;

    fetch('/api/filter-options')
        .then(r => r.json())
        .then(opts => {
            selects.forEach(sel => {
                const key      = sel.dataset.filterKey;
                const values   = opts[key] || [];
                const selected = (sel.dataset.selected || '').split('||').filter(Boolean);
                const current  = [...sel.options].map(o => o.value);

                values.forEach(v => {
                    if (current.includes(v)) return;
                    const o = document.createElement('option');
                    o.value = v; o.textContent = v;
                    sel.appendChild(o);
                });

                if (window.$ && $(sel).hasClass('select2-js')) {
                    // Select2 initialized before options arrived — destroy and
                    // re-init so it picks up the newly added option elements.
                    if ($(sel).data('select2')) $(sel).select2('destroy');
                    $(sel).select2();
                    const validSel = selected.filter(v => values.includes(v));
                    if (validSel.length) $(sel).val(validSel).trigger('change');
                } else {
                    // Plain <select>: mark previously chosen values as selected.
                    selected.forEach(v => {
                        const opt = [...sel.options].find(o => o.value === v);
                        if (opt) opt.selected = true;
                    });
                }
            });
        })
        .catch(err => console.error('filter-options failed:', err));
});
</script>
