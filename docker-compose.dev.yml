# Dev compose. Two supported ways to use it, and they are NOT interchangeable.
#
#   1. AS AN OVERRIDE (what CLAUDE.md documents, and what you want for HL7):
#          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#      Everything from the base file — including nginx on 443 — plus this file's
#      dev credentials, the app on 8080 and Postgres on 5432 for psql and MCP.
#
#   2. STANDALONE:
#          docker compose -f docker-compose.dev.yml up -d
#      App, worker and database only. NO nginx, so no TLS and nothing on 443.
#
# ⚠ THE TWO MODES USE DIFFERENT DATABASE VOLUMES.
#   base alone      -> postgres_data
#   with this file  -> postgres_dev_data     (override wins, verified via
#                                             `docker compose config`)
#
# So switching modes silently swaps you onto a different database, which presents
# as "all my data vanished". It is also how a bare `docker compose up -d rayd-app`
# once recreated rayd_db against the wrong volume. Pick one mode and stay in it;
# if you must run a one-off command, pass the SAME -f flags you started with.
#
# Credentials here are intentionally minimal dev values; never use in production.
services:

  rayd-app:
    build: .
    container_name: ${RAYD_CONTAINER_PREFIX:-rayd}_service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Beirut
      - SECRET_KEY=dev-secret-key-change-in-prod
      - POSTGRES_USER=etl_user
      - POSTGRES_PASSWORD=etl_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=etl_db
      - MASTER_ADMIN_KEY=dev-admin-key
      - PATIENT_PORTAL_ENABLED=false
      - LIVE_FEED_ENABLED=true
    depends_on:
      db:
        condition: service_healthy

  # Service key MUST match the base file's (rayd-nlp), not be a new name.
  #
  # This was `nlp-worker`, which made the documented override command
  #     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
  # fail outright with:
  #     services.rayd-nlp: container name "rayd_nlp" is already in use by service {}
  # Compose saw two DIFFERENT services both claiming container_name rayd_nlp and
  # refused, rather than treating this as an override of the base service.
  rayd-nlp:
    build: ./nlp_worker
    container_name: ${RAYD_CONTAINER_PREFIX:-rayd}_nlp
    restart: unless-stopped
    environment:
      - TZ=Asia/Beirut
      - POSTGRES_USER=etl_user
      - POSTGRES_PASSWORD=etl_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=etl_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: ${RAYD_CONTAINER_PREFIX:-rayd}_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=etl_user
      - POSTGRES_PASSWORD=etl_pass
      - POSTGRES_DB=etl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d etl_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data:
