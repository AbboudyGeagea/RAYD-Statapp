# crn-gateway VM: /etc/nginx/sites-enabled/crn-gateway-https
# Public https listener for the doctors' links (https://criticalresults.newmazloum.com/n/<token>,
# DNS -> 194.147.127.3 -> this VM). Sits next to the existing port-80 site (crn-gateway), which
# RAYD keeps using over the LAN.
#
# Certificate: Let's Encrypt (90 days) for criticalresults.newmazloum.com, issued and renewed by
# root's acme.sh over port 443 (TLS-ALPN: port 80 is not open from the internet). nginx is stopped
# for the few seconds of each check (pre/post hooks), then the files below are rewritten and nginx
# reloaded. Renewal is automatic (root crontab, acme.sh --cron, at 60 days). Set up 2026-10-28 with
#   acme.sh --issue --alpn -d criticalresults.newmazloum.com --server letsencrypt --keylength ec-256 --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
#   acme.sh --install-cert -d criticalresults.newmazloum.com --ecc --key-file /etc/ssl/private/crn-gateway.key --fullchain-file /etc/ssl/certs/crn-gateway.crt --reloadcmd "systemctl reload nginx"
# The earlier self-signed IP certificate is kept as crn-gateway.{crt,key}.selfsigned.

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/crn-gateway.crt;
    ssl_certificate_key /etc/ssl/private/crn-gateway.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # No access log: every /n/ URL carries a doctor's link token. The gateway logs opens itself.
    access_log off;

    # The internet only needs the doctor's page; /api is for RAYD, over the LAN on port 80.
    location /api/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
