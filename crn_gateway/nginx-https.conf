# crn-gateway VM: /etc/nginx/sites-enabled/crn-gateway-https
# Public https listener for the doctors' links (https://194.147.127.3/n/<token>).
# Sits next to the existing port-80 site (crn-gateway), which RAYD keeps using over the LAN.
#
# Certificate: self-signed for the IP, made on the VM with
#   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 365 -keyout /etc/ssl/private/crn-gateway.key -out /etc/ssl/certs/crn-gateway.crt -subj /CN=194.147.127.3 -addext subjectAltName=IP:194.147.127.3
# Browsers warn about it: fine for the test, not for doctors. Phase 2 = hostname + Let's Encrypt.

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/crn-gateway.crt;
    ssl_certificate_key /etc/ssl/private/crn-gateway.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # No access log: every /n/ URL carries a doctor's link token. The gateway logs opens itself.
    access_log off;

    # The internet only needs the doctor's page; /api is for RAYD, over the LAN on port 80.
    location /api/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
