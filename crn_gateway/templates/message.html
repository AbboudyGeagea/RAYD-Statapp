<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ title }}</title>
<style>
  body { margin:0; background:#f6f7f9; color:#17202b; font:16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background:#11161c; color:#e6ebf1; } .card { background:#18202a !important; border-color:#2b3642 !important; } }
  .card { max-width:520px; margin:15vh auto 0; background:#fff; border:1px solid #dde2e8; border-radius:12px; padding:24px; text-align:center; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { margin:0; }
</style>
</head>
<body>
  <div class="card"><h1>{{ title }}</h1><p>{{ text }}</p></div>
</body>
</html>
