# Rate limiting for login endpoints
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

# Suppress debug and info logs, only log warnings and errors
error_log /var/log/nginx/error.log warn;
access_log /var/log/nginx/access.log combined buffer=32k flush=5s;

# Docker's embedded DNS — re-resolve upstream IPs every 5 s so container
# rebuilds don't leave nginx pointing at a dead IP (the 502 after updates).
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Hide server version
    server_tokens off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Public CA cert download, for client trust-store setup (nginx/certs/README.md).
    # Not a secret -- this is the CA's public certificate, never the private key.
    # First-time download still hits the browser's "not private" warning until the
    # CA itself is trusted (unavoidable chicken-and-egg) -- proceed through once.
    location = /rayd-ca.crt {
        alias /etc/nginx/certs/rayd-ca.crt;
        add_header Content-Disposition "attachment; filename=rayd-ca.crt" always;
        add_header Content-Type "application/x-x509-ca-cert" always;
    }

    location /login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://rayd-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /portal {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://rayd-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Suppress logs for frequent polling endpoints
    location ~ ^/hl7-orders/count$ {
        access_log off;
        proxy_pass http://rayd-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://rayd-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running reports / exports / manual ETL triggers
        proxy_read_timeout    300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        keepalive_timeout     65s;
    }
}
