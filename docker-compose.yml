services:

  nginx:
    image: nginx:stable-alpine
    container_name: rayd_proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - rayd-app
    restart: always

  rayd-app:
    build: .
    container_name: rayd_service
    restart: always
    ports:
      - "6661:6661"
    env_file:
      - .env
    environment:
      # ── Core ─────────────────────────────────────────────────
      - TZ=${TZ:-Asia/Beirut}
      - SECRET_KEY=${SECRET_KEY}
      - LD_LIBRARY_PATH=/opt/oracle/instantclient_21_13

      # ── Database ─────────────────────────────────────────────
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}

      # ── Feature Flags ─────────────────────────────────────────
      - PATIENT_PORTAL_ENABLED=${PATIENT_PORTAL_ENABLED:-true}
      - LIVE_FEED_ENABLED=${LIVE_FEED_ENABLED:-true}

      # ── HL7 senders allowed on 6661 (IPs/CIDRs, comma-separated; empty = any) ──
      - HL7_ALLOWED_SENDERS=${HL7_ALLOWED_SENDERS:-}

    volumes:
      - /opt/rayd/logs:/opt/rayd/logs
      - ./static:/app/static

    depends_on:
      db:
        condition: service_healthy

  # Report NLP is part of the full RAYD product, not the portal: it starts only
  # with COMPOSE_PROFILES=analytics in .env.
  rayd-nlp:
    build: ./nlp_worker
    container_name: rayd_nlp
    profiles: ["analytics"]
    restart: always
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Beirut}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15
    container_name: rayd_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
