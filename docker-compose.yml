services:

  nginx:
    image: nginx:stable-alpine
    container_name: rayd_proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - rayd-app
    restart: always

  rayd-app:
    build: .
    container_name: rayd_service
    restart: always
    ports:
      # HL7/MLLP listener — the senders (Carestream PACS, SAP/Mirth HIS, RIS) are REMOTE
      # hosts, so this cannot be bound to 127.0.0.1 without killing HL7 ingestion.
      # Access control is enforced by a source-IP whitelist: scripts/hl7_firewall.sh
      # (DOCKER-USER chain — published ports bypass INPUT, see the script's comments).
      # HL7_BIND_ADDR optionally narrows the listener to one host interface as defence
      # in depth; it defaults to 0.0.0.0 so existing deployments are unaffected.
      - "${HL7_BIND_ADDR:-0.0.0.0}:6661:6661"
    env_file:
      - .env
    environment:
      # ── Core ─────────────────────────────────────────────────
      - TZ=${TZ:-Asia/Beirut}
      - SECRET_KEY=${SECRET_KEY}
      - LD_LIBRARY_PATH=/opt/oracle/instantclient_21_13

      # ── Database ─────────────────────────────────────────────
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}

      # ── Master Admin ──────────────────────────────────────────
      - MASTER_ADMIN_KEY=${MASTER_ADMIN_KEY}

      # ── Feature Flags ─────────────────────────────────────────
      - PATIENT_PORTAL_ENABLED=${PATIENT_PORTAL_ENABLED:-false}
      - LIVE_FEED_ENABLED=${LIVE_FEED_ENABLED:-true}
      # ETL Phase 8 auto-fills modalities/procedures from PACS. LAUMC sources these
      # from the RIS (std_devices / std_procedure_codes) or manual import, so it sets
      # this false in .env. Default '1' preserves the old behaviour for other sites.
      - RAYD_ETL_LOOKUP_FROM_PACS=${RAYD_ETL_LOOKUP_FROM_PACS:-1}

    volumes:
      - /opt/rayd/logs:/opt/rayd/logs
      - ./static:/app/static

    depends_on:
      db:
        condition: service_healthy

  rayd-nlp:
    build: ./nlp_worker
    container_name: rayd_nlp
    restart: always
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Beirut}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15
    container_name: rayd_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
