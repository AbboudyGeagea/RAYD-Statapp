services:

  nginx:
    image: nginx:stable-alpine
    container_name: rayd_proxy
    ports:
      # HTTPS only. Port 80 is deliberately NOT published — another application owns
      # it on this host, and a duplicate binding fails the whole `up` rather than
      # just this container.
      #
      # nginx still listens on 80 INSIDE the container and still serves the
      # HTTP->HTTPS redirect (see nginx/conf.d/default.conf); it simply is not
      # reachable from the host. The only thing lost is the courtesy redirect for
      # someone who types http:// by hand — they get a connection refused instead.
      # To restore it on a host where 80 is free, add: - "${HTTP_PORT:-80}:80"
      #
      # HTTPS_PORT exists so this can move off 443 too without editing the file.
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - rayd-app
    restart: always

  rayd-app:
    build: .
    container_name: rayd_service
    restart: always
    ports:
      # HL7/MLLP listener — the senders (Carestream PACS, SAP/Mirth HIS, RIS) are REMOTE
      # hosts, so this cannot be bound to 127.0.0.1 without killing HL7 ingestion.
      # Access control is enforced by a source-IP whitelist: scripts/hl7_firewall.sh
      # (DOCKER-USER chain — published ports bypass INPUT, see the script's comments).
      # HL7_BIND_ADDR optionally narrows the listener to one host interface as defence
      # in depth; it defaults to 0.0.0.0 so existing deployments are unaffected.
      - "${HL7_BIND_ADDR:-0.0.0.0}:6661:6661"
    env_file:
      - .env
    environment:
      # ── Core ─────────────────────────────────────────────────
      - TZ=${TZ:-Asia/Beirut}
      - SECRET_KEY=${SECRET_KEY}

      # ── Database ─────────────────────────────────────────────
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}

      # ── Master Admin ──────────────────────────────────────────
      - MASTER_ADMIN_KEY=${MASTER_ADMIN_KEY}

      # ── Feature Flags ─────────────────────────────────────────
      - PATIENT_PORTAL_ENABLED=${PATIENT_PORTAL_ENABLED:-false}
      - LIVE_FEED_ENABLED=${LIVE_FEED_ENABLED:-true}
      # RAYD_ETL_LOOKUP_FROM_PACS dropped with ETL Phase 8 — there is no PACS
      # database to mine modalities and procedures out of on this branch. That
      # master data arrives by MFN message or CSV import instead.

    volumes:
      # RAYD_LOG_DIR so this works on a developer machine as well as a Linux server.
      # The default is the production path; on Docker Desktop that resolves inside
      # the WSL VM rather than on the Windows filesystem, so the logs are written
      # somewhere real but effectively invisible. Set RAYD_LOG_DIR=./logs in .env to
      # put them next to the project instead.
      - ${RAYD_LOG_DIR:-/opt/rayd/logs}:/opt/rayd/logs
      - ./static:/app/static
      # No Oracle Instant Client bind mount on the HL7 branch — the client is not
      # installed on the host and the image no longer links against it.

    depends_on:
      db:
        condition: service_healthy

  rayd-nlp:
    build: ./nlp_worker
    container_name: rayd_nlp
    restart: always
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Beirut}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15
    container_name: rayd_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
